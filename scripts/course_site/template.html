<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f5f6f3; --surface: #ffffff; --ink: #16181c; --ink-2: #4a515b; --muted: #747b85;
    --rule: #dcdfd9; --accent: #1b5e64; --accent-soft: #e1eded; --code-bg: #eceee9;
    --warm: #a2541b; --ok: #2f7a4b;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0f1113; --surface: #161a1d; --ink: #e6e8ea; --ink-2: #b8bec5; --muted: #868d96;
      --rule: #2a2f34; --accent: #67c3c8; --accent-soft: #182a2c; --code-bg: #1b1f23;
      --warm: #e09a62; --ok: #6cc28f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0f1113; --surface: #161a1d; --ink: #e6e8ea; --ink-2: #b8bec5; --muted: #868d96;
    --rule: #2a2f34; --accent: #67c3c8; --accent-soft: #182a2c; --code-bg: #1b1f23;
    --warm: #e09a62; --ok: #6cc28f;
  }
  html { background: var(--paper); }
  body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.62; margin: 0; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* top bar with the spectrum strip */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper);
            border-bottom: 1px solid var(--rule); padding-inline: 16px; }
  .topbar-row { display: flex; align-items: center; gap: 14px; max-width: 1280px; margin: 0 auto; height: 52px; }
  .brand { font-family: var(--sans); font-weight: 700; font-size: 1rem; letter-spacing: 0.01em; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .brand small { font-weight: 500; color: var(--muted); margin-left: 6px; }
  .menu-btn { display: none; font: 600 0.85rem var(--sans); background: none; border: 1px solid var(--rule); color: var(--ink);
              border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .strip { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 14px; min-width: 0; }
  .strip a { display: block; border-radius: 2px; opacity: 0.22; transition: opacity 0.2s, transform 0.2s; }
  .strip a.read { opacity: 1; }
  .strip a.here { opacity: 1; transform: scaleY(1.6); }
  .strip a:hover { opacity: 0.85; }
  .progress { font: 500 0.78rem var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* layout */
  .shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
  nav.toc { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 53px);
            overflow-y: auto; padding: 20px 16px 40px 16px; border-right: 1px solid var(--rule); font-family: var(--sans); }
  .toc h3 { font-size: 0.7rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a { display: grid; grid-template-columns: 26px 1fr 14px; gap: 6px; align-items: baseline; text-decoration: none;
           color: var(--ink-2); font-size: 0.86rem; line-height: 1.35; padding: 5px 8px; border-radius: 6px; }
  .toc a:hover { background: var(--accent-soft); color: var(--ink); }
  .toc a.here { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .toc .num { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toc .tick { color: var(--ok); font-size: 0.8rem; }
  .toc .seq-note { font-size: 0.74rem; color: var(--warm); margin: 2px 8px 4px; }

  main { padding-inline: 16px; padding-block: 28px 80px; min-width: 0; }
  article { max-width: 70ch; margin: 0 auto; }
  .part-head { display: grid; gap: 8px; margin-bottom: 18px; }
  .eyebrow { font: 600 0.74rem var(--sans); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .swatch { width: 26px; height: 8px; border-radius: 2px; display: inline-block; }
  article h1 { font-family: var(--sans); font-weight: 700; font-size: clamp(1.75rem, 3.4vw, 2.4rem); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  article h2 { font-family: var(--sans); font-weight: 650; font-size: 1.35rem; margin: 2.2em 0 0.5em; text-wrap: balance; }
  article h3 { font-family: var(--sans); font-weight: 600; font-size: 1.08rem; margin: 1.7em 0 0.4em; }
  article p, article li { color: var(--ink); }
  article blockquote { margin: 1.2em 0; padding: 0.7em 1.1em; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  article blockquote p { margin: 0.3em 0; }
  article blockquote.lede { font-size: 1.12rem; border-left-width: 4px; }
  article code { font-family: var(--mono); font-size: 0.82em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
  article pre { background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
  article pre code { background: none; padding: 0; font-size: 0.8rem; }
  .table-wrap { overflow-x: auto; margin: 1.2em 0; }
  article table { border-collapse: collapse; font-family: var(--sans); font-size: 0.88rem; width: 100%; }
  article th, article td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
  article th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  article details { margin: 1.2em 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  article details summary { cursor: pointer; padding: 10px 14px; font: 600 0.92rem var(--sans); color: var(--accent); }
  article details > *:not(summary) { margin-inline: 16px; }
  article hr { border: none; border-top: 1px solid var(--rule); margin: 2.4em 0; }
  .part-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; font-family: var(--sans); }
  .part-nav a, .part-nav button { display: block; text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px;
                                  color: var(--ink); background: var(--surface); font: inherit; text-align: left; cursor: pointer; }
  .part-nav .next { text-align: right; }
  .part-nav small { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 2px; }
  .mark { grid-column: 1 / -1; text-align: center !important; font-weight: 600; color: var(--accent) !important; }
  .mark.done { color: var(--ok) !important; }

  /* figures */
  .fig { margin: 1.6em 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 16px; font-family: var(--sans); }
  .fig-title { font-weight: 650; font-size: 0.95rem; margin: 0 0 4px; }
  .fig-sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 12px; }
  .fig svg { width: 100%; height: auto; display: block; }
  .fig svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .fig .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 10px; font-size: 0.84rem; color: var(--ink-2); }
  .fig label { display: flex; align-items: center; gap: 8px; }
  .fig input[type=range] { width: 140px; accent-color: var(--accent); }
  .fig button.chip { font: 500 0.8rem var(--sans); border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .fig button.chip.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .fig .readout { font-family: var(--mono); font-size: 0.8rem; color: var(--ink); background: var(--code-bg); border-radius: 6px; padding: 8px 10px; margin-top: 10px; white-space: pre-wrap; overflow-x: auto; }
  .fig .scroll { overflow-x: auto; }

  /* landing */
  .hero-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; height: 54px; margin: 22px 0 6px; }
  .hero-strip a { border-radius: 3px; display: block; }
  .hero-axis { display: flex; justify-content: space-between; font: 500 0.72rem var(--mono); color: var(--muted); }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .menu-btn { display: inline-block; }
    nav.toc { position: fixed; inset: calc(53px + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; background: var(--paper); z-index: 15;
              border-right: none; transform: translateX(-100%); transition: transform 0.2s; }
    nav.toc.open { transform: none; }
    .progress { display: none; }
    body { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topbar">
  <div class="topbar-row">
    <button class="menu-btn" id="menuBtn" aria-controls="toc" aria-expanded="false">Parts</button>
    <a class="brand" href="#p00">__BRAND__<small>__BRAND_SMALL__</small></a>
    <div class="strip" id="strip" aria-label="Course progress across the spectrum"></div>
    <span class="progress" id="progress"></span>
  </div>
</header>
<div class="shell">
  <nav class="toc" id="toc" aria-label="Course parts"></nav>
  <main><article id="article" aria-live="polite"></article></main>
</div>

<script type="application/json" id="course-data">__COURSE_JSON__</script>
<script type="application/json" id="config-data">__CONFIG_JSON__</script>
<script type="application/json" id="spectrum-data">__SPECTRUM_JSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(() => {
  const PARTS = JSON.parse(document.getElementById("course-data").textContent);
  const SPEC = JSON.parse(document.getElementById("spectrum-data").textContent);
  const REPO = "https://github.com/rashwin88/hsi-anomaly-foundations-allotrope/blob/main/";
  const CFG = JSON.parse(document.getElementById("config-data").textContent);
  const SECTIONS = CFG.sections;
  const byNum = Object.fromEntries(PARTS.map(p => [p.num, p]));
  const nums = PARTS.map(p => p.num).sort((a, b) => a - b);
  const course = nums.filter(n => n > 0);

  // ---- per-viewer read state (best effort) ----
  const KEY = CFG.storageKey;
  let read = new Set();
  try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
  const saveRead = () => { try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch (e) {} };

  // ---- each part gets a colour from the spectrum: the first part near 420 nm, the last near 2400 nm ----
  const LAST = Math.max(...PARTS.map(p => p.num));
  const wlOf = (n) => 420 + (Math.max(n, 1) - 1) / Math.max(LAST - 1, 1) * (2400 - 420);
  function colourOf(n) {
    const w = wlOf(n);
    if (w <= 700) {
      const stops = [[420, 268], [460, 235], [490, 195], [520, 130], [560, 75], [590, 45], [630, 15], [700, 0]];
      for (let i = 0; i < stops.length - 1; i++) {
        const [w0, h0] = stops[i], [w1, h1] = stops[i + 1];
        if (w <= w1) return `hsl(${h0 + (h1 - h0) * (w - w0) / (w1 - w0)} 78% 52%)`;
      }
    }
    const t = (w - 700) / (2400 - 700);            // infrared: deep red -> wine -> dusk violet
    return `hsl(${350 - 60 * t} ${62 - 22 * t}% ${44 - 12 * t}%)`;
  }

  // ---- navigation ----
  const toc = document.getElementById("toc");
  toc.innerHTML = SECTIONS.map(([name, a, b]) => {
    const items = nums.filter(n => n >= a && n <= b).map(n => {
      const p = byNum[n];
      return `<li><a href="#p${String(n).padStart(2, "0")}" data-n="${n}"><span class="num">${String(n).padStart(2, "0")}</span><span>${p.title}</span><span class="tick" aria-hidden="true"></span></a></li>`;
    }).join("");
    const note = CFG.notes[a] ? `<p class="seq-note">${CFG.notes[a]}</p>` : "";
    return `<h3>${name}</h3>${note}<ol>${items}</ol>`;
  }).join("");
  const strip = document.getElementById("strip");
  strip.innerHTML = course.map(n => `<a href="#p${String(n).padStart(2, "0")}" data-n="${n}" style="background:${colourOf(n)}" title="${String(n).padStart(2, "0")} · ${byNum[n].title.replace(/"/g, "&quot;")}" aria-label="Part ${n}"></a>`).join("");

  function refreshChrome(cur) {
    toc.querySelectorAll("a[data-n]").forEach(a => {
      const n = +a.dataset.n;
      a.classList.toggle("here", n === cur);
      a.querySelector(".tick").textContent = read.has(n) ? "✓" : "";
    });
    strip.querySelectorAll("a").forEach(a => {
      const n = +a.dataset.n;
      a.classList.toggle("read", read.has(n));
      a.classList.toggle("here", n === cur);
    });
    document.getElementById("progress").textContent = `${course.filter(n => read.has(n)).length} / ${course.length} read`;
  }

  // ---- markdown -> page ----
  marked.setOptions({ gfm: true });
  function fixLinks(root) {
    root.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      const m = h.match(/^(\d{2})-[^/]*\.md(#.*)?$/);
      if (m) { a.setAttribute("href", `#p${m[1]}`); return; }
      if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (h.startsWith("#")) return;
      const path = decodeURIComponent(new URL(h, "https://x/" + CFG.folder + "/").pathname.slice(1));
      a.setAttribute("href", REPO + path.split("/").map(encodeURIComponent).join("/"));
      a.target = "_blank"; a.rel = "noopener";
    });
    root.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }

  const article = document.getElementById("article");
  function render(n) {
    if (!byNum[n]) n = 0;
    const p = byNum[n];
    const tag = String(n).padStart(2, "0");
    const body = p.md.replace(/^#\s+.*\n/, "");          // the title is drawn by the page head
    const sectionName = (SECTIONS.find(([, a, b]) => n >= a && n <= b) || ["", 0, 0])[0];
    article.innerHTML = `
      <div class="part-head">
        <div class="eyebrow">${n ? `<span class="swatch" style="background:${colourOf(n)}"></span>Part ${tag} · ${sectionName}` : "Start here"}</div>
        <h1>${p.title}</h1>
      </div>
      <div class="md">${marked.parse(body)}</div>`;
    const first = article.querySelector(".md > blockquote");
    if (first && /one thing/i.test(first.textContent)) first.classList.add("lede");
    fixLinks(article);
    if (n === 0) landing(article);
    (FIGS[n] || []).forEach(f => insertFigure(f));

    const i = nums.indexOf(n), prev = nums[i - 1], next = nums[i + 1];
    const nav = document.createElement("div"); nav.className = "part-nav";
    nav.innerHTML =
      (prev !== undefined ? `<a class="prev" href="#p${String(prev).padStart(2, "0")}"><small>Previous</small>${byNum[prev].title}</a>` : "<span></span>") +
      (next !== undefined ? `<a class="next" href="#p${String(next).padStart(2, "0")}"><small>Next</small>${byNum[next].title}</a>` : "<span></span>") +
      (n ? `<button class="mark ${read.has(n) ? "done" : ""}" id="markBtn">${read.has(n) ? "✓ Read - mark as unread" : "Mark this part as read"}</button>` : "");
    article.appendChild(nav);
    const mb = document.getElementById("markBtn");
    if (mb) mb.onclick = () => { read.has(n) ? read.delete(n) : read.add(n); saveRead(); render(n); };
    nav.querySelector(".next")?.addEventListener("click", () => { if (n) { read.add(n); saveRead(); } });
    refreshChrome(n);
    document.title = n ? `${tag} ${p.title} - ${CFG.title}` : CFG.title;
  }

  function landing(root) {
    const lede = document.createElement("div");
    lede.innerHTML = `<div class="hero-strip">${course.map(n => `<a href="#p${String(n).padStart(2, "0")}" style="background:${colourOf(n)};opacity:${read.has(n) ? 1 : 0.85}" title="${String(n).padStart(2, "0")} · ${byNum[n].title.replace(/"/g, "&quot;")}" aria-label="Part ${n}"></a>`).join("")}</div>
      <div class="hero-axis"><span>part 01 · 420 nm</span><span>visible | infrared</span><span>part ${String(LAST).padStart(2, "0")} · 2400 nm</span></div>
      <p style="font-family:var(--sans);font-size:0.86rem;color:var(--muted)">Each part takes a colour from the spectrum the sensors read, from violet at part 01 into the shortwave infrared at part ${String(LAST).padStart(2, "0")}. The strip at the top fills in as you mark parts read.</p>`;
    root.querySelector(".md").prepend(lede);
  }

  function insertFigure(f) {
    const host = document.createElement("div"); host.className = "fig";
    const anchor = article.querySelector(".md > blockquote.lede") || article.querySelector(".md > blockquote") || article.querySelector(".md > p");
    anchor ? anchor.after(host) : article.querySelector(".md").prepend(host);
    f(host);
  }

  // ---- figures ----
  const NS = "http://www.w3.org/2000/svg";
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function svg(w, h, label) { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.setAttribute("role", "img"); s.setAttribute("aria-label", label); return s; }
  function el(parent, tag, attrs, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; parent.appendChild(e); return e; }
  const head = (host, t, s) => { host.insertAdjacentHTML("beforeend", `<p class="fig-title">${t}</p><p class="fig-sub">${s}</p>`); };
  const f4 = (x) => x.toFixed(4);

  // part 02 - a real spectrum
  function figSpectrum(host) {
    head(host, "A real pixel is a curve", "Median reflectance of 128,000 pixels from 500 random SpectralEarth patches, with the 10th-90th percentile band. Hover to read it.");
    const W = 640, H = 260, m = { l: 44, r: 10, t: 10, b: 30 }, x0 = 400, x1 = 2460, yMax = 0.6;
    const s = svg(W, H, "Median SpectralEarth reflectance spectrum from 418 to 2445 nm"); host.appendChild(s);
    const X = w => m.l + (w - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - Math.min(v, yMax) / yMax * (H - m.t - m.b);
    for (let v = 0; v <= yMax + 1e-9; v += 0.2) { el(s, "line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: css("--rule") }); el(s, "text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }, v.toFixed(1)); }
    [500, 1000, 1500, 2000].forEach(w => el(s, "text", { x: X(w), y: H - 10, "text-anchor": "middle" }, `${w} nm`));
    const segs = []; let cur = [];
    SPEC.wavelength_nm.forEach((w, i) => { if (cur.length && w - SPEC.wavelength_nm[i - 1] > 30) { segs.push(cur); cur = []; } cur.push(i); }); segs.push(cur);
    segs.forEach(sg => {
      const top = sg.map(i => `${X(SPEC.wavelength_nm[i])},${Y(SPEC.p90[i])}`), bot = sg.slice().reverse().map(i => `${X(SPEC.wavelength_nm[i])},${Y(SPEC.p10[i])}`);
      el(s, "polygon", { points: top.concat(bot).join(" "), fill: css("--accent"), "fill-opacity": 0.14 });
      el(s, "polyline", { points: sg.map(i => `${X(SPEC.wavelength_nm[i])},${Y(SPEC.median[i])}`).join(" "), fill: "none", stroke: css("--accent"), "stroke-width": 2, "stroke-linejoin": "round" });
    });
    el(s, "text", { x: X(712), y: Y(0.34), fill: css("--ink-2") }, "red edge");
    el(s, "text", { x: X(1400), y: Y(0.56), "text-anchor": "middle" }, "water");
    el(s, "text", { x: X(1850), y: Y(0.56), "text-anchor": "middle" }, "water");
    const ro = document.createElement("div"); ro.className = "readout"; ro.textContent = "Hover the curve."; host.appendChild(ro);
    const dot = el(s, "circle", { r: 4, fill: css("--accent"), visibility: "hidden" });
    s.addEventListener("pointermove", e => {
      const r = s.getBoundingClientRect(), wl = x0 + ((e.clientX - r.left) / r.width * W - m.l) / (W - m.l - m.r) * (x1 - x0);
      let i = 0; SPEC.wavelength_nm.forEach((w, k) => { if (Math.abs(w - wl) < Math.abs(SPEC.wavelength_nm[i] - wl)) i = k; });
      dot.setAttribute("cx", X(SPEC.wavelength_nm[i])); dot.setAttribute("cy", Y(SPEC.median[i])); dot.setAttribute("visibility", "visible");
      ro.textContent = `${SPEC.wavelength_nm[i].toFixed(1)} nm  ${SPEC.family[i]}  median ${SPEC.median[i].toFixed(3)}  (p10 ${SPEC.p10[i].toFixed(3)} - p90 ${SPEC.p90[i].toFixed(3)})`;
    });
  }

  // part 08 & 35 - softmax, optionally with masking
  function figSoftmax(host, withMask) {
    head(host, withMask ? "Masking a dead band" : "Softmax, live",
      withMask ? "Mark a band dead and its score becomes minus infinity: its weight drops to exactly zero, and the others grow to fill the gap."
               : "Drag the scores. Softmax turns them into weights that are all positive and sum to 1.");
    const scores = withMask ? [2, 1, 0] : [2, 1, 0], dead = [false, false, false];
    const W = 640, H = 170, s = svg(W, H, "Softmax weights for three scores"); host.appendChild(s);
    const ctr = document.createElement("div"); ctr.className = "controls"; host.appendChild(ctr);
    const ro = document.createElement("div"); ro.className = "readout"; host.appendChild(ro);

  // anomaly course part 08 - why RX divides by the covariance
  function figRX(host) {
    head(host, "Distance in units of how the scene varies", "Two bands, a background whose bands move together. P and Q are the same straight-line distance from the mean; RX (Mahalanobis) disagrees. Push the correlation towards 1 and watch Q's score explode - the near-singular problem in two dimensions.");
    let rho = 0.8;
    const W = 640, H = 340, cx = 320, cy = 170, k = 46, s = svg(W, H, "Correlated two-band scatter with Mahalanobis contours"); host.appendChild(s);
    const ctr = document.createElement("div"); ctr.className = "controls"; host.appendChild(ctr);
    ctr.innerHTML = `<label>band correlation <input type="range" id="rxr" min="0" max="0.999" step="0.001" value="0.8"> <b>0.800</b></label>`;
    const ro = document.createElement("div"); ro.className = "readout"; host.appendChild(ro);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const Z = Array.from({ length: 260 }, () => { const u = rnd(), v = rnd(), r = Math.sqrt(-2 * Math.log(u)); return [r * Math.cos(2 * Math.PI * v), r * Math.sin(2 * Math.PI * v)]; });
    const P = [1.5, 1.5], Q = [1.5, -1.5], X = x => cx + x * k, Y = y => cy - y * k;

      el(s, "line", { x1: 40, x2: W - 40, y1: cy, y2: cy, stroke: css("--rule") }); el(s, "line", { x1: cx, x2: cx, y1: 10, y2: H - 10, stroke: css("--rule") });

      const c = Math.sqrt(1 - rho * rho);
      Z.forEach(([a, b]) => { const y = rho * a + c * b; if (Math.abs(a) < 6.5 && Math.abs(y) < 3.5) el(s, "circle", { cx: X(a), cy: Y(y), r: 2.2, fill: css("--muted"), "fill-opacity": 0.45 }); });
      [1, 2, 3].forEach(m => el(s, "ellipse", { cx, cy, rx: Math.max(0.5, m * Math.sqrt(1 + rho) * k), ry: Math.max(0.5, m * Math.sqrt(1 - rho) * k), transform: `rotate(-45 ${cx} ${cy})`, fill: "none", stroke: css("--accent"), "stroke-opacity": 0.7 }));
      [[P, "P"], [Q, "Q"]].forEach(([p, n]) => { el(s, "circle", { cx: X(p[0]), cy: Y(p[1]), r: 6, fill: n === "P" ? css("--accent") : css("--warm"), stroke: css("--surface"), "stroke-width": 2 }); el(s, "text", { x: X(p[0]) + 10, y: Y(p[1]) + 4, fill: css("--ink") }, n); });

      ro.textContent = `straight-line distance  P ${Math.hypot(...P).toFixed(2)}   Q ${Math.hypot(...Q).toFixed(2)}\nRX score (x-mu)^T Sigma^-1 (x-mu), unit variances\n  P = 4.5 / (1 + rho) = ${m2(P).toFixed(2)}\n  Q = 4.5 / (1 - rho) = ${m2(Q).toFixed(2)}\ncovariance determinant 1 - rho^2 = ${(1 - rho * rho).toFixed(6)}`;
    }

    head(host, "Faders in front of a fixed mixdown", "Part 10's pixel and recipe. Each slider is the gate network's score for one band; sigmoid turns it into a fader between 0 and 1. The recipe W never changes - only the faders do.");
    const x = [1.2, 1.0, -0.4, -0.6], W = [[0.5, 0.5, 0, 0], [0, 0, 0.5, 0.5]], z = [-2, -2, 2, 2];
    const sig = v => 1 / (1 + Math.exp(-v));
    const s = svg(640, 200, "Gate values per band and the gated outputs"); host.appendChild(s);
    const ctr = document.createElement("div"); ctr.className = "controls"; host.appendChild(ctr);
    const ro = document.createElement("div"); ro.className = "readout"; host.appendChild(ro);
    const labs = z.map((v, i) => { const lab = document.createElement("label"); lab.innerHTML = `score z${i} <input type="range" min="-10" max="10" step="0.5" value="${v}"> <b>${v}</b>`; ctr.appendChild(lab);
      lab.querySelector("input").oninput = e => { z[i] = +e.target.value; lab.querySelector("b").textContent = z[i]; draw(); }; return lab; });
    [["shadowed: [-2,-2,2,2]", [-2, -2, 2, 2]], ["start of training: all 0", [0, 0, 0, 0]], ["try to kill band 0: -10", [-10, 0, 0, 0]]].forEach(([t, v]) => {
      const b = document.createElement("button"); b.className = "chip"; b.textContent = t; ctr.appendChild(b);
      b.onclick = () => { v.forEach((a, i) => { z[i] = a; labs[i].querySelector("input").value = a; labs[i].querySelector("b").textContent = a; }); draw(); }; });
    function draw() {
      s.replaceChildren();
      const g = z.map(sig), xp = x.map((v, i) => g[i] * v), y = W.map(r => r.reduce((a, w, i) => a + w * xp[i], 0)), y0 = W.map(r => r.reduce((a, w, i) => a + w * x[i], 0));
      g.forEach((v, i) => { const cx = 70 + i * 110;
        el(s, "rect", { x: cx - 6, y: 20, width: 12, height: 140, rx: 6, fill: css("--code-bg") });
        el(s, "rect", { x: cx - 6, y: 160 - 140 * v, width: 12, height: Math.max(140 * v, 1), rx: 6, fill: css("--accent") });
        el(s, "rect", { x: cx - 18, y: 160 - 140 * v - 6, width: 36, height: 12, rx: 3, fill: css("--surface"), stroke: css("--ink") });
        el(s, "text", { x: cx, y: 180, "text-anchor": "middle", fill: css("--ink") }, `g${i} ${v.toFixed(4)}`);
        el(s, "text", { x: cx, y: 196, "text-anchor": "middle" }, `x${i} = ${x[i]}`); });
      el(s, "text", { x: 470, y: 60, fill: css("--ink") }, `y0 = ${y[0].toFixed(3)}`); el(s, "text", { x: 470, y: 78 }, `today ${y0[0].toFixed(3)}`);
      el(s, "text", { x: 470, y: 118, fill: css("--ink") }, `y1 = ${y[1].toFixed(3)}`); el(s, "text", { x: 470, y: 136 }, `today ${y0[1].toFixed(3)}`);
      const eff = W.map(r => r.map((w, i) => (w * g[i]).toFixed(3)));
      ro.textContent = `g  = sigmoid(z) = [${g.map(v => v.toFixed(4)).join(", ")}]\nx' = g * x      = [${xp.map(v => v.toFixed(3)).join(", ")}]\neffective recipe W . diag(g) = [[${eff[0].join(", ")}], [${eff[1].join(", ")}]]\nleak of a dead band holding 99 through g0: ${(99 * g[0]).toFixed(4)}  (cross-attention with -inf: exactly 0)`;
    }
    draw();
  }

  const FIGSETS = {
    indradhanu: { 2: [figSpectrum], 8: [h => figSoftmax(h, false)], 10: [figMixdown], 12: [figAttention], 18: [figMaskGrid],
                  32: [figCrossSelf], 33: [figEncoding], 35: [h => figSoftmax(h, true)], 36: [figMemory], 39: [figGate] },
    anomaly: { 2: [figSpectrum], 8: [figRX], 11: [figTwoPass], 12: [figL1SAM] },
  };
  const FIGS = FIGSETS[CFG.figs] || {};

  // ---- routing ----
  function route() {
    const m = location.hash.match(/^#p(\d{1,2})$/);
    render(m ? +m[1] : 0);
    window.scrollTo(0, 0);
    toc.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
  }
  window.addEventListener("hashchange", route);
  document.getElementById("menuBtn").onclick = (e) => { const o = toc.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", String(o)); };
  const reRender = () => { const m = location.hash.match(/^#p(\d{1,2})$/); render(m ? +m[1] : 0); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reRender);
  new MutationObserver(reRender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  route();
})();
</script>
