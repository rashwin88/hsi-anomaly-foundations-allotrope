# Alembic config for the INVENTORY database (Supabase), kept apart from
# alembic.ini so the two migration histories never mix.
#   alembic -c alembic-inventory.ini upgrade head
# The URL comes from allotrope_inventory.config in env.py, never from here.

[alembic]
script_location = alembic_inventory
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
