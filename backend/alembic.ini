# Alembic configuration.
#
# The DB URL is intentionally a placeholder here — env.py overrides it at
# runtime with settings.database_url, so the real value comes from the
# DATABASE_URL env var (set by docker-compose).

[alembic]
# Path to migration scripts (relative to alembic.ini location)
script_location = alembic

# Migration filename template: <revision>_<slug>.py
# We hand-pick revision ids of the form YYYYMMDD_NN, so this is mostly
# documentation rather than something Alembic will use for autogenerate.
file_template = %%(rev)s_%%(slug)s

# Make the backend package importable from migration scripts (so we can
# refer to allotrope.* if a migration ever needs to).
prepend_sys_path = .

# Use UTC for any auto-generated timestamps in filenames.
timezone = UTC

# Truncate slug at this length (keeps filenames readable)
truncate_slug_length = 40

# Placeholder URL — env.py overrides via settings.database_url.
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@placeholder/placeholder


# --- Logging --------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
