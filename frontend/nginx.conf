# Allotrope frontend — nginx config.
#
# Two responsibilities:
#   1. Serve the built React SPA (static files from /usr/share/nginx/html).
#      Unknown paths fall back to index.html (client-side routing).
#   2. Proxy /api/* to the api service on the compose network.
#      The trailing slash on proxy_pass strips the /api prefix:
#        browser hits  GET /api/auth/me
#        nginx sends   GET /auth/me  to api:8000
#
#   3. Proxy GET /inventory-api/* to the raw-dataset inventory service,
#      read-only, for logged-in users only (see the location block).
#
# This file is a TEMPLATE: the nginx image runs envsubst over it at start,
# restricted to INVENTORY_* names (NGINX_ENVSUBST_FILTER in the Dockerfile),
# so nginx's own $variables pass through untouched.
#
# Single-origin discipline: browser sees only http://localhost:3000.
# Cookies set by the api are scoped to the frontend's origin and
# auto-attach on subsequent /api/* requests. No CORS, no SameSite=Lax
# relaxation. SameSite=Strict works as designed.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Multipart uploads can be large — a single PRISMA HE5 is ~2 GB, an
    # EnMAP folder can exceed 1 GB, and an AVIRIS-NG scene folder is
    # ~6.5 GB (the primary _corr_*.bin alone is 6.4 GB). Default 1 MB
    # cap would 413 every real onboard. 20 GB gives headroom.
    client_max_body_size 20g;
    # Generous timeouts so a slow upload from the demo machine's HDD
    # doesn't hit the proxy's read timeout mid-stream. 30 min covers a
    # 6 GB AVIRIS-NG upload on a modest LAN.
    client_body_timeout  1800s;
    proxy_read_timeout   1800s;
    proxy_send_timeout   1800s;

    # API proxy. Rewrite /api/foo → /foo on the api side.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Stream the multipart body to the api as it arrives (default
        # buffers the whole body to a temp file first — fine for 2 KB,
        # silly for 2 GB).
        proxy_request_buffering off;
        # Don't rewrite cookies — pass Set-Cookie unchanged to the browser.
        proxy_pass_header  Set-Cookie;
    }

    # Raw-dataset inventory (backend/allotrope_inventory), read-only.
    #   - auth_request: only a browser holding a valid JWT cookie gets through
    #     — nginx asks the api's /auth/me and forwards only on a 2xx.
    #   - The api key is added here, server-side; the browser never sees it.
    #   - GET only: the UI is a viewer. Writes go through the CLI.
    #   - The upstream is a variable resolved per request through Docker's
    #     DNS, because `inventory` is an opt-in compose profile: a static
    #     proxy_pass to a missing host would stop nginx from starting at all.
    #     Absent service → 502, which the UI shows as "unavailable".
    location /inventory-api/ {
        limit_except GET { deny all; }
        auth_request /_auth_check;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inventory_upstream http://inventory:8020;
        rewrite ^/inventory-api/(.*)$ /$1 break;
        proxy_pass $inventory_upstream;

        proxy_set_header   X-Inventory-Key "${INVENTORY_UI_KEY}";
        proxy_set_header   Cookie          "";
        proxy_set_header   Host            $host;
    }

    location = /_auth_check {
        internal;
        proxy_pass              http://api:8000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # SPA fallback. Any URL that's NOT a real file or directory under
    # /usr/share/nginx/html (and isn't /api/*) returns index.html, so
    # client-side React Router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible defaults
    sendfile        on;
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
