name: base
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  # Geospatial
  - gdal=3.8.*
  - rasterio=1.3.*
  - pyproj=3.6.*
  - shapely=2.0.*
  - fiona=1.9.*
  # Scientific
  - numpy=1.26.*
  - scipy=1.11.*
  - scikit-learn=1.3.*
  - pandas=2.1.*
  - xarray=2023.12.*
  - h5py=3.10.*
  - netcdf4=1.6.*
  # RTM emulator (sRTMnet is a Keras H5 model)
  - tensorflow=2.15.*
  # Parallelism (ISOFIT uses Ray for empirical line)
  - ray-default=2.9.*
  # Utility
  - pyyaml
  - matplotlib-base
  - tqdm
  - click
  - pip
