version: "3.9"

# Local dev / test harness. On the air-gap host use scripts/run_scene.sh
# instead so no compose runtime is needed.

services:
  enmap-isofit:
    build:
      context: .
      args:
        ISOFIT_VERSION: "3.4.0"
    image: enmap-isofit:1.1.4
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${L1C_DIR:?set L1C_DIR to your EnMAP L1C product dir}:/data/l1c:ro
      - ${L2A_DIR:?set L2A_DIR to your output dir}:/data/l2a
      - ${DEM_DIR:?set DEM_DIR to your Cop-DEM tile dir}:/aux/dem:ro
    environment:
      N_CORES: "${N_CORES:-8}"
    command:
      - /data/l1c
      - /data/l2a
      - --season
      - "${SEASON:-auto}"
