<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The 39 real labelled objects lying inside FT03 water or cloud mask, by kind, and which exclusion hides them">
<title>The 39 real labelled objects lying inside FT03 water or cloud mask, by kind, and which exclusion hides them</title>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b45f06" stroke-width="1.4"/></pattern></defs>
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<text x="18" y="24" font-size="12.5" fill="#1f2328" font-weight="700">39 of 909 real objects lie wholly inside FT03's water / cloud mask (checked 2026-10-17)</text>
<text x="390" y="80" font-size="11" text-anchor="end" fill="#1f2328">set1, water, more than 3 px offshore (likely vessels)</text>
<rect x="400" y="60" width="364" height="30" fill="#b45f06"/>
<text x="772" y="80" font-size="12" fill="#1f2328" font-weight="700">13</text>
<text x="390" y="132" font-size="11" text-anchor="end" fill="#1f2328">set1, water, within 3 px of shore</text>
<rect x="400" y="112" width="392" height="30" fill="#b45f06"/>
<text x="800" y="132" font-size="12" fill="#1f2328" font-weight="700">14</text>
<text x="390" y="184" font-size="11" text-anchor="end" fill="#1f2328">set2 / set3, shorelines</text>
<rect x="400" y="164" width="224" height="30" fill="#b45f06"/>
<text x="632" y="184" font-size="12" fill="#1f2328" font-weight="700">8</text>
<text x="390" y="236" font-size="11" text-anchor="end" fill="#1f2328">set4, under haze FT03 calls cloud</text>
<rect x="400" y="216" width="112" height="30" fill="#b45f06"/>
<rect x="400" y="216" width="112" height="30" fill="url(#hatch)" stroke="#0f766e" stroke-width="2.5"/>
<text x="520" y="236" font-size="12" fill="#1f2328" font-weight="700">4</text>
<line x1="400" y1="50" x2="400" y2="270" stroke="#4b535d" stroke-width="1.2"/>
<rect x="60" y="282" width="18" height="14" fill="#b45f06"/>
<text x="84" y="294" font-size="11" fill="#1f2328">hidden by water + cloud exclusion (all 39)</text>
<rect x="400" y="282" width="18" height="14" fill="url(#hatch)" stroke="#0f766e" stroke-width="2.5"/>
<text x="424" y="294" font-size="11" fill="#1f2328">also hidden by cloud-only exclusion (4) - objects seen through haze</text>
<text x="60" y="318" font-size="10.5" fill="#7d858f">Sources: docs/lld/implant-bench.md "Decisions"; 13 offshore of set1's 27 water objects; 14 = 27 - 13. set4: haze, not desert (2026-10-18).</text>
</svg>
