<text x="258.0" y="315.0" font-size="10" text-anchor="middle" fill="#7d858f" xml:space="preserve" style="white-space:pre">0.4</text>
<text x="352.0" y="315.0" font-size="10" text-anchor="middle" fill="#7d858f" xml:space="preserve" style="white-space:pre">0.6</text>
<text x="446.0" y="315.0" font-size="10" text-anchor="middle" fill="#7d858f" xml:space="preserve" style="white-space:pre">0.8</text>
