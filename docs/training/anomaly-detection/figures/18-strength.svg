<text x="305.0" y="332.0" font-size="10.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">strength s</text>
<text x="70.0" y="50.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">contrast z(s)</text>
