<circle cx="164.0" cy="300.0" r="5" fill="#ffffff" stroke="#7d858f" stroke-width="2"/>
<text x="174.0" y="292.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">minimum at s = 0.2</text>
<circle cx="305.0" cy="210.0" r="5" fill="#ffffff" stroke="#3a4aa8" stroke-width="2"/>
<text x="313.0" y="226.0" font-size="10" text-anchor="start" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">simple formula: s = 0.5 -&gt; z = 0.6</text>
<circle cx="399.0" cy="150.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="391.0" y="138.0" font-size="10" text-anchor="end" fill="#0f766e" font-weight="700" xml:space="preserve" style="white-space:pre">solver: s = 0.7 -&gt; z = 1.0</text>
<text x="580.0" y="80.0" font-size="10.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">z(s) = mean |o0 + s x step - r| / mean sigma</text>
<text x="580.0" y="98.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre"></text>
<text x="580.0" y="116.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">The implant first cancels the spot's</text>
<text x="580.0" y="134.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">natural +0.02, then overshoots it.</text>
<text x="580.0" y="152.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre"></text>
<text x="580.0" y="170.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">The LLD's s = z x mean(sigma) / mean|step|</text>
<text x="580.0" y="188.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">assumes o0 = r, and lands in the wrong tier.</text>
<text x="580.0" y="206.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre"></text>
<text x="580.0" y="224.0" font-size="10.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">Rules in solve_strength:</text>
<text x="580.0" y="242.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">- answer: first crossing at or after the minimum</text>
<text x="580.0" y="260.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">- z(0) above the target: None, try another spot</text>
<text x="580.0" y="278.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">- material out of reach at f = 1: capped, recorded</text>
</svg>
