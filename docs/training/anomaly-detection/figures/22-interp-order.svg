<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="np.interp on the same three samples listed ascending and descending: the descending list returns a flat line">
<title>np.interp on the same three samples listed ascending and descending</title>
<rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
<text x="18" y="24" font-size="12.5" fill="#1f2328" font-weight="700">Same samples (500, 600, 700 nm -&gt; 1, 2, 4), two listing orders, np.interp on NumPy 2.5.2</text>
<!-- panel a -->
<text x="60" y="52" font-size="12" fill="#1f2328" font-weight="700">(a) listed 500, 600, 700 - ascending</text>
<line x1="60" y1="280" x2="400" y2="280" stroke="#4b535d" stroke-width="1.2"/>
<line x1="60" y1="280" x2="60" y2="70" stroke="#4b535d" stroke-width="1.2"/>
<text x="54" y="284" font-size="10" text-anchor="end" fill="#7d858f">0</text>
<text x="54" y="235" font-size="10" text-anchor="end" fill="#7d858f">1</text>
<text x="54" y="186" font-size="10" text-anchor="end" fill="#7d858f">2</text>
<text x="54" y="137" font-size="10" text-anchor="end" fill="#7d858f">3</text>
<text x="54" y="88" font-size="10" text-anchor="end" fill="#7d858f">4</text>
<text x="117" y="296" font-size="10" text-anchor="middle" fill="#7d858f">500</text>
<text x="230" y="296" font-size="10" text-anchor="middle" fill="#7d858f">600</text>
<text x="343" y="296" font-size="10" text-anchor="middle" fill="#7d858f">700</text>
<text x="230" y="314" font-size="10.5" text-anchor="middle" fill="#4b535d">wavelength, nm</text>
<polyline points="60,231.1 116.7,231.1 230,182.2 343.3,84.4 400,84.4" fill="none" stroke="#0f766e" stroke-width="2.4"/>
<circle cx="116.7" cy="231.1" r="5" fill="#0f766e"/>
<circle cx="230" cy="182.2" r="5" fill="#0f766e"/>
<circle cx="343.3" cy="84.4" r="5" fill="#0f766e"/>
<circle cx="173.3" cy="206.7" r="5" fill="#ffffff" stroke="#b45f06" stroke-width="2.4"/>
<text x="181" y="222" font-size="11" fill="#b45f06" font-weight="700">550 -&gt; 1.5</text>
<circle cx="286.7" cy="133.3" r="5" fill="#ffffff" stroke="#b45f06" stroke-width="2.4"/>
<text x="294" y="149" font-size="11" fill="#b45f06" font-weight="700">650 -&gt; 3.0</text>
<!-- panel b -->
<text x="500" y="52" font-size="12" fill="#1f2328" font-weight="700">(b) listed 700, 600, 500 - descending, as PRISMA</text>
<line x1="500" y1="280" x2="840" y2="280" stroke="#4b535d" stroke-width="1.2"/>
<line x1="500" y1="280" x2="500" y2="70" stroke="#4b535d" stroke-width="1.2"/>
<text x="494" y="284" font-size="10" text-anchor="end" fill="#7d858f">0</text>
<text x="494" y="235" font-size="10" text-anchor="end" fill="#7d858f">1</text>
<text x="494" y="186" font-size="10" text-anchor="end" fill="#7d858f">2</text>
<text x="494" y="137" font-size="10" text-anchor="end" fill="#7d858f">3</text>
<text x="494" y="88" font-size="10" text-anchor="end" fill="#7d858f">4</text>
<text x="557" y="296" font-size="10" text-anchor="middle" fill="#7d858f">500</text>
<text x="670" y="296" font-size="10" text-anchor="middle" fill="#7d858f">600</text>
<text x="783" y="296" font-size="10" text-anchor="middle" fill="#7d858f">700</text>
<text x="670" y="314" font-size="10.5" text-anchor="middle" fill="#4b535d">wavelength, nm</text>
<polyline points="556.7,231.1 670,182.2 783.3,84.4" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="500" y1="84.4" x2="556.7" y2="84.4" stroke="#b45f06" stroke-width="2.6"/>
<line x1="556.7" y1="231.1" x2="840" y2="231.1" stroke="#b45f06" stroke-width="2.6"/>
<circle cx="556.7" cy="231.1" r="5" fill="#0f766e"/>
<circle cx="670" cy="182.2" r="5" fill="#0f766e"/>
<circle cx="783.3" cy="84.4" r="5" fill="#0f766e"/>
<circle cx="613.3" cy="231.1" r="5" fill="#ffffff" stroke="#b45f06" stroke-width="2.4"/>
<text x="613" y="252" font-size="11" text-anchor="middle" fill="#b45f06" font-weight="700">550 -&gt; 1</text>
<circle cx="726.7" cy="231.1" r="5" fill="#ffffff" stroke="#b45f06" stroke-width="2.4"/>
<text x="727" y="252" font-size="11" text-anchor="middle" fill="#b45f06" font-weight="700">650 -&gt; 1</text>
<text x="640" y="120" font-size="10.5" fill="#4b535d">every x &gt; 500 nm (the last listed)</text>
<text x="640" y="135" font-size="10.5" fill="#4b535d">returns the last listed value, 1</text>
<!-- legend -->
<circle cx="70" cy="340" r="5" fill="#0f766e"/>
<text x="82" y="344" font-size="10.5" fill="#1f2328">samples (dashed in b: the true line)</text>
<line x1="320" y1="340" x2="346" y2="340" stroke="#b45f06" stroke-width="2.6"/>
<text x="354" y="344" font-size="10.5" fill="#1f2328">what np.interp returns</text>
<text x="530" y="344" font-size="10.5" fill="#7d858f">PRISMA 2477 -&gt; 453 nm: every grid band got the 453 nm value</text>
</svg>
