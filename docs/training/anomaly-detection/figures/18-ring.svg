<text x="350.0" y="236.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">ring = binary_dilation(obj, iterations=3) &amp; ~binary_dilation(obj, iterations=1) &amp; valid</text>
<text x="350.0" y="254.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">scipy's default structure is the 4-neighbour cross: steps = rows apart + columns apart.</text>
<text x="350.0" y="272.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">Real and implanted objects use the same ring - the tier edges depend on it.</text>
<text x="350.0" y="290.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">tests/test_utils/test_implant.py, test_contrast_z_by_hand: ring.sum() == 20.</text>
