<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Sliding-window inference over a whole scene">
<title>Sliding-window inference over a whole scene</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="860" height="280" fill="#ffffff"/>
<rect x="40" y="40" width="200" height="200" rx="2" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<rect x="40" y="40" width="25.6" height="25.6" rx="1" fill="none" stroke="#3a4aa8" stroke-width="1.2"/>
<rect x="46.4" y="41.5" width="25.6" height="25.6" rx="1" fill="none" stroke="#3a4aa8" stroke-width="1.2"/>
<rect x="52.8" y="43" width="25.6" height="25.6" rx="1" fill="none" stroke="#3a4aa8" stroke-width="1.2"/>
<rect x="59.2" y="44.5" width="25.6" height="25.6" rx="1" fill="none" stroke="#3a4aa8" stroke-width="1.2"/>
<text x="140" y="258" font-size="11" text-anchor="middle" fill="#4b535d">1000 x 1000 scene</text>
<text x="140" y="273" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">29 x 29 = 841 tiles</text>
<text x="330" y="40" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Along one axis: tiles 128 long, starting every 32</text>
<rect x="330" y="70" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="334" y="80" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 0</text>
<rect x="381.2" y="86" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="385.2" y="96" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 32</text>
<rect x="432.4" y="102" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="436.4" y="112" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 64</text>
<rect x="483.6" y="118" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="487.6" y="128" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 96</text>
<rect x="534.8" y="134" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="538.8" y="144" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 128</text>
<rect x="586" y="150" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="590" y="160" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 160</text>
<rect x="637.2" y="166" width="204.8" height="12" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="641.2" y="176" font-size="9.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start 192</text>
<line x1="554" y1="62" x2="554" y2="186" stroke="#b45f06" stroke-width="2" stroke-linecap="round"/>
<text x="554" y="202" font-size="10.5" text-anchor="middle" fill="#b45f06">pixel 140</text>
<text x="330" y="236" font-size="11" text-anchor="start" fill="#4b535d">Each interior pixel lies in 128 / 32 = 4 tiles per axis: 4 x 4 = 16 reconstructions,</text>
<text x="330" y="252" font-size="11" text-anchor="start" fill="#4b535d">summed into recon_sum and count, then averaged. Each tile runs two passes.</text>
</svg>
