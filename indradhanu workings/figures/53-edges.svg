<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Edges: score-map correction versus a training-time edge term under the blind spot">
<title>Edges: score-map correction versus a training-time edge term under the blind spot</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
<text x="18.0" y="24.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">a  Correcting the score map by edge strength</text>
<rect x="40.0" y="74.0" width="34.0" height="126.0" rx="2" fill="#ffffff" stroke="#8f979f" stroke-width="1.3"/>
<rect x="84.0" y="137.0" width="34.0" height="63.0" rx="2" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="79.0" y="220.0" font-size="10.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">field boundary</text>
<rect x="170.0" y="67.0" width="34.0" height="133.0" rx="2" fill="#ffffff" stroke="#b45f06" stroke-width="1.3"/>
<rect x="214.0" y="130.0" width="34.0" height="70.0" rx="2" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="209.0" y="220.0" font-size="10.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">small target</text>
<rect x="300.0" y="172.0" width="34.0" height="28.0" rx="2" fill="#ffffff" stroke="#8f979f" stroke-width="1.3"/>
<rect x="344.0" y="172.0" width="34.0" height="28.0" rx="2" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="339.0" y="220.0" font-size="10.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">smooth field</text>
<line x1="30.0" y1="200.0" x2="420.0" y2="200.0" stroke="#4b535d" stroke-width="1"/>
<text x="40.0" y="246.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">left bar: score before; right bar: after rank minus bin median</text>
<text x="40.0" y="262.0" font-size="10.5" text-anchor="start" fill="#b45f06" font-weight="700" xml:space="preserve" style="white-space:pre">both strong-edge pixels drop together: bench 0.86 -&gt; 0.67</text>
<text x="40.0" y="290.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">49-68% of top-1% false positives on strong edges,</text>
<text x="40.0" y="306.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">but also 29-79% of target pixels (chance: 10%)</text>
<text x="40.0" y="330.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">(illustrative bar heights)</text>
<text x="470.0" y="24.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">b  Under the blind spot (one hidden 4 x 4 px token)</text>
<rect x="480" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="532" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="584" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="480" y="102" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="532" y="102" width="52" height="52" fill="url(#hatch)" stroke="#3a4aa8" stroke-width="1"/>
<rect x="584" y="102" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="480" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="532" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="584" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<line x1="550.0" y1="50.0" x2="550.0" y2="102.0" stroke="#0f766e" stroke-width="3"/>
<line x1="550.0" y1="154.0" x2="550.0" y2="206.0" stroke="#0f766e" stroke-width="3"/>
<line x1="550.0" y1="102.0" x2="550.0" y2="154.0" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/>
<text x="558.0" y="226.0" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">boundary: predictable</text>
<rect x="690" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="742" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="794" y="50" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="690" y="102" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="742" y="102" width="52" height="52" fill="url(#hatch)" stroke="#3a4aa8" stroke-width="1"/>
<rect x="794" y="102" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="690" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="742" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="794" y="154" width="52" height="52" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="760" y="120" width="14" height="14" fill="#b45f06"/>
<text x="768.0" y="226.0" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">isolated target: not</text>
<text x="480.0" y="250.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">Every pixel is reconstructed while its own token is hidden</text>
<text x="480.0" y="266.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(two complementary checkerboard passes).</text>
<text x="480.0" y="290.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">A gradient-matching loss on hidden pixels rewards</text>
<text x="480.0" y="306.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">sharp continuation of what the context predicts.</text>
<text x="480.0" y="330.0" font-size="10.5" text-anchor="start" fill="#b45f06" xml:space="preserve" style="white-space:pre">Caveat: a target bigger than one token is partly</text>
<text x="480.0" y="346.0" font-size="10.5" text-anchor="start" fill="#b45f06" xml:space="preserve" style="white-space:pre">visible in the neighbouring tokens of the same pass.</text>
</svg>
