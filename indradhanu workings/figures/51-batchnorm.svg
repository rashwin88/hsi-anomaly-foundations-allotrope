<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="BatchNorm with sensor-pure batches: running mean at epoch end, and train versus eval normalisation">
<title>BatchNorm with sensor-pure batches: running mean at epoch end, and train versus eval normalisation</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
<text x="18.0" y="24.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">a  The last micro-batches of an epoch drag the running mean</text>
<rect x="104.0" y="46.0" width="62.0" height="26.0" rx="4" fill="#ffffff" stroke="#3a4aa8" stroke-width="1.4"/>
<text x="135.0" y="63.0" font-size="10" text-anchor="middle" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">PRISMA</text>
<rect x="174.0" y="46.0" width="62.0" height="26.0" rx="4" fill="#ffffff" stroke="#3a4aa8" stroke-width="1.4"/>
<text x="205.0" y="63.0" font-size="10" text-anchor="middle" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">PRISMA</text>
<rect x="244.0" y="46.0" width="62.0" height="26.0" rx="4" fill="#ffffff" stroke="#3a4aa8" stroke-width="1.4"/>
<text x="275.0" y="63.0" font-size="10" text-anchor="middle" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">PRISMA</text>
<rect x="314.0" y="46.0" width="62.0" height="26.0" rx="4" fill="#ffffff" stroke="#8a3b86" stroke-width="1.4"/>
<text x="345.0" y="63.0" font-size="10" text-anchor="middle" fill="#8a3b86" font-weight="700" xml:space="preserve" style="white-space:pre">AVIRIS-NG</text>
<text x="20.0" y="63.0" font-size="10.5" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">batch</text>
<text x="396.0" y="63.0" font-size="10.5" text-anchor="start" fill="#b45f06" font-weight="700" xml:space="preserve" style="white-space:pre">-&gt; validation</text>
<line x1="90.0" y1="166.5" x2="396.0" y2="166.5" stroke="#e3e6ea" stroke-width="1"/>
<text x="86.0" y="170.5" font-size="10" text-anchor="end" fill="#7d858f" xml:space="preserve" style="white-space:pre">0.2</text>
<line x1="90.0" y1="119.5" x2="396.0" y2="119.5" stroke="#e3e6ea" stroke-width="1"/>
<text x="86.0" y="123.5" font-size="10" text-anchor="end" fill="#7d858f" xml:space="preserve" style="white-space:pre">0.3</text>
<line x1="90.0" y1="190.0" x2="396.0" y2="190.0" stroke="#4b535d" stroke-width="1"/>
<text x="96.0" y="204.0" font-size="9.5" text-anchor="middle" fill="#7d858f" xml:space="preserve" style="white-space:pre">start</text>
<polyline points="96.0,166.5 166.0,147.7 236.0,130.8 306.0,115.6 376.0,148.8" fill="none" stroke="#b45f06" stroke-width="2"/>
<circle cx="96.0" cy="166.5" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="2"/>
<text x="96.0" y="158.5" font-size="9.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">0.2</text>
<circle cx="166.0" cy="147.7" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="2"/>
<text x="166.0" y="139.7" font-size="9.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">0.24</text>
<circle cx="236.0" cy="130.8" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="2"/>
<text x="236.0" y="122.8" font-size="9.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">0.276</text>
<circle cx="306.0" cy="115.6" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="2"/>
<text x="306.0" y="107.6" font-size="9.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">0.3084</text>
<circle cx="376.0" cy="148.8" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="2"/>
<text x="376.0" y="140.8" font-size="9.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">0.2376</text>
<text x="20.0" y="214.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">running mean = 0.9 x old + 0.1 x batch mean   (channel means: EnMAP 0.2, PRISMA 0.6, AVIRIS-NG -0.4; illustrative)</text>
<text x="480.0" y="116.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">~90% of the stored value comes</text>
<text x="480.0" y="132.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">from the last 22 micro-batches</text>
<text x="480.0" y="148.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(0.9^22 = 0.098) - 0.6% of an epoch</text>
<text x="18.0" y="246.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">b  Training normalises each sensor by itself; evaluation by one running mean</text>
<text x="20.0" y="284.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">training</text>
<text x="20.0" y="300.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">(batch statistics)</text>
<rect x="230.0" y="266.0" width="200.0" height="42.0" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="240.0" y="283.0" font-size="10.5" text-anchor="start" fill="#0f766e" font-weight="700" xml:space="preserve" style="white-space:pre">EnMAP</text>
<text x="240.0" y="300.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(0.2 - 0.2) = 0.0</text>
<rect x="450.0" y="266.0" width="200.0" height="42.0" rx="5" fill="#ffffff" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="460.0" y="283.0" font-size="10.5" text-anchor="start" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">PRISMA</text>
<text x="460.0" y="300.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(0.6 - 0.6) = 0.0</text>
<rect x="670.0" y="266.0" width="200.0" height="42.0" rx="5" fill="#ffffff" stroke="#8a3b86" stroke-width="1.3"/>
<text x="680.0" y="283.0" font-size="10.5" text-anchor="start" fill="#8a3b86" font-weight="700" xml:space="preserve" style="white-space:pre">AVIRIS-NG</text>
<text x="680.0" y="300.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(-0.4 - (-0.4)) = 0.0</text>
<text x="20.0" y="342.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">evaluation</text>
<text x="20.0" y="358.0" font-size="10" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">(running mean 0.2)</text>
<rect x="230.0" y="324.0" width="200.0" height="42.0" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="240.0" y="341.0" font-size="10.5" text-anchor="start" fill="#0f766e" font-weight="700" xml:space="preserve" style="white-space:pre">EnMAP</text>
<text x="240.0" y="358.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(0.2 - 0.2) = 0.0</text>
<rect x="450.0" y="324.0" width="200.0" height="42.0" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="460.0" y="341.0" font-size="10.5" text-anchor="start" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">PRISMA</text>
<text x="460.0" y="358.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(0.6 - 0.2) = +0.4</text>
<rect x="670.0" y="324.0" width="200.0" height="42.0" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="680.0" y="341.0" font-size="10.5" text-anchor="start" fill="#8a3b86" font-weight="700" xml:space="preserve" style="white-space:pre">AVIRIS-NG</text>
<text x="680.0" y="358.0" font-size="10.5" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">(-0.4 - 0.2) = -0.6</text>
<text x="230.0" y="390.0" font-size="10" text-anchor="start" fill="#b45f06" xml:space="preserve" style="white-space:pre">amber: an offset the encoder never saw in training (spread 1 assumed)</text>
</svg>
