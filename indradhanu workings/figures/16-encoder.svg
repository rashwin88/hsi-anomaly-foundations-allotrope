<text x="20" y="30" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="600">Spatial detail falls (32 x 32 to 4 x 4) while width grows (32 to 256 channels).</text>
<text x="20" y="48" font-size="11" text-anchor="start" fill="#4b535d">Hidden tokens (hatched) are removed at stage 1 only, and F1 keeps their holes all the way to the decoder.</text>
<text x="20" y="330" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Front-face size follows the token grid; depth follows the channel count (both compressed for drawing). Each arrow is a patch embedding.</text>
