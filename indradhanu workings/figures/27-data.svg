<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="From satellite scene to training batches">
<title>From satellite scene to training batches</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="920" height="250" fill="#ffffff"/>
<rect x="14" y="60" width="132" height="50" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="80" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">raw scene</text>
<text x="80" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">sensor file</text>
<rect x="164" y="60" width="132" height="50" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="230" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">vendable</text>
<text x="230" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165, H, W)</text>
<line x1="148" y1="85" x2="162" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="314" y="60" width="132" height="50" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="380" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">PatchPlanGenerator</text>
<text x="380" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">where to cut</text>
<line x1="298" y1="85" x2="312" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="464" y="60" width="132" height="50" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="530" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">patcher</text>
<text x="530" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">128 x 128 patches</text>
<line x1="448" y1="85" x2="462" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="614" y="60" width="132" height="50" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="680" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">.tar shards</text>
<text x="680" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">on S3</text>
<line x1="598" y1="85" x2="612" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="764" y="60" width="132" height="50" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="830" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">DataLoader</text>
<text x="830" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">batches</text>
<line x1="748" y1="85" x2="762" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="300" y="140" width="200" height="90" rx="2" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<rect x="304" y="144" width="58" height="58" rx="2" fill="none" stroke="#3a4aa8" stroke-width="1.2"/>
<rect x="332.8" y="144" width="58" height="58" rx="2" fill="none" stroke="#3a4aa8" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="361.6" y="144" width="58" height="58" rx="2" fill="none" stroke="#3a4aa8" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="304" y="172.8" width="58" height="58" rx="2" fill="none" stroke="#3a4aa8" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="332.8" y="172.8" width="58" height="58" rx="2" fill="none" stroke="#3a4aa8" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="512" y="166" font-size="10.5" text-anchor="start" fill="#4b535d">patch 128 x 128, stride 64 in training:</text>
<text x="512" y="182" font-size="10.5" text-anchor="start" fill="#4b535d">neighbouring patches overlap by half;</text>
<text x="512" y="198" font-size="10.5" text-anchor="start" fill="#4b535d">the last one snaps to the scene edge.</text>
<text x="400" y="246" font-size="10" text-anchor="middle" fill="#7d858f">one scene, patches (drawn not to scale)</text>
<text x="14" y="30" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="600">Each stage has one job; an epoch is one pass over the surviving patches.</text>
</svg>
