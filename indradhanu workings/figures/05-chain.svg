<text x="537" y="160" font-size="10.5" text-anchor="middle" fill="#b45f06">the threshold</text>
<text x="14" y="30" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="600">Indradhanu is one option inside the anomaly_scoring Action, not an Action of its own.</text>
<text x="14" y="236" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Each box is an Action; each writes its outputs to its own folder and the next Action reads them.</text>
