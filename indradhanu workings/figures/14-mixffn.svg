<text x="330" y="200" font-size="16" text-anchor="middle" fill="#4b535d">...</text>
<text x="40" y="290" font-size="10.5" text-anchor="start" fill="#4b535d">channel 1, 2, 3, 4 ... each mixes only its own 8 neighbours</text>
<text x="470" y="150" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Parameters at 128 channels</text>
<text x="470" y="180" font-size="11.5" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">ordinary 3x3:  128 x 128 x 9 + 128 = 147,584</text>
<text x="470" y="202" font-size="11.5" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">depthwise 3x3:       128 x 9 + 128 =   1,280</text>
<text x="470" y="228" font-size="11" text-anchor="start" fill="#4b535d">115 times cheaper; channel mixing is left</text>
<text x="470" y="244" font-size="11" text-anchor="start" fill="#4b535d">to the two Linear layers on either side.</text>
