<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The three native-band fine-tuning datasets and alignment by wavelength">
<title>The three native-band fine-tuning datasets and alignment by wavelength</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="820" height="430" fill="#ffffff"/>
<text x="18" y="24" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">a  Three sensors, three band lists (native-v1 shards)</text>
<rect x="20" y="38" width="252" height="216" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.1"/>
<rect x="21" y="39" width="250" height="28" rx="5" fill="#e3f3f1"/>
<text x="32" y="58" font-size="13" text-anchor="start" fill="#0f766e" font-weight="700">EnMAP</text>
<text x="32" y="88" font-size="10.5" text-anchor="start" fill="#7d858f">bands</text>
<text x="108" y="88" font-size="10.5" text-anchor="start" fill="#1f2328">224, each scene's own</text>
<text x="32" y="109" font-size="10.5" text-anchor="start" fill="#7d858f">aligned to</text>
<text x="108" y="109" font-size="10.5" text-anchor="start" fill="#1f2328">enmap_224.json</text>
<text x="32" y="130" font-size="10.5" text-anchor="start" fill="#7d858f">pixel</text>
<text x="108" y="130" font-size="10.5" text-anchor="start" fill="#1f2328">30 m (tile 3.84 km)</text>
<text x="32" y="151" font-size="10.5" text-anchor="start" fill="#7d858f">train / test</text>
<text x="108" y="151" font-size="10.5" text-anchor="start" fill="#1f2328">14,542 / 950</text>
<text x="32" y="172" font-size="10.5" text-anchor="start" fill="#7d858f">split by</text>
<text x="108" y="172" font-size="10.5" text-anchor="start" fill="#1f2328">datatake (6 in test)</text>
<text x="32" y="193" font-size="10.5" text-anchor="start" fill="#7d858f">labels</text>
<text x="108" y="193" font-size="10.5" text-anchor="start" fill="#1f2328">cloud, cirrus 0-3, haze,</text>
<text x="32" y="214" font-size="10.5" text-anchor="start" fill="#7d858f"></text>
<text x="108" y="214" font-size="10.5" text-anchor="start" fill="#1f2328">shadow, snow, land/water</text>
<text x="32" y="235" font-size="10.5" text-anchor="start" fill="#7d858f">quirk</text>
<text x="108" y="235" font-size="10.5" text-anchor="start" fill="#1f2328">QL_PIXELMASK gaps</text>
<rect x="288" y="38" width="252" height="216" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.1"/>
<rect x="289" y="39" width="250" height="28" rx="5" fill="#e9ebf8"/>
<text x="300" y="58" font-size="13" text-anchor="start" fill="#3a4aa8" font-weight="700">PRISMA</text>
<text x="300" y="88" font-size="10.5" text-anchor="start" fill="#7d858f">bands</text>
<text x="376" y="88" font-size="10.5" text-anchor="start" fill="#1f2328">234 of 239 (flags)</text>
<text x="300" y="109" font-size="10.5" text-anchor="start" fill="#7d858f">aligned to</text>
<text x="376" y="109" font-size="10.5" text-anchor="start" fill="#1f2328">none needed</text>
<text x="300" y="130" font-size="10.5" text-anchor="start" fill="#7d858f">pixel</text>
<text x="376" y="130" font-size="10.5" text-anchor="start" fill="#1f2328">30 m (tile 3.84 km)</text>
<text x="300" y="151" font-size="10.5" text-anchor="start" fill="#7d858f">train / test</text>
<text x="376" y="151" font-size="10.5" text-anchor="start" fill="#1f2328">14,802 / 1,570</text>
<text x="300" y="172" font-size="10.5" text-anchor="start" fill="#7d858f">split by</text>
<text x="376" y="172" font-size="10.5" text-anchor="start" fill="#1f2328">15 km site</text>
<text x="300" y="193" font-size="10.5" text-anchor="start" fill="#7d858f">labels</text>
<text x="376" y="193" font-size="10.5" text-anchor="start" fill="#1f2328">none</text>
<text x="300" y="214" font-size="10.5" text-anchor="start" fill="#7d858f"></text>
<text x="376" y="214" font-size="10.5" text-anchor="start" fill="#1f2328"></text>
<text x="300" y="235" font-size="10.5" text-anchor="start" fill="#7d858f">quirk</text>
<text x="376" y="235" font-size="10.5" text-anchor="start" fill="#1f2328">VNIR listed 980 nm down</text>
<rect x="556" y="38" width="252" height="216" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.1"/>
<rect x="557" y="39" width="250" height="28" rx="5" fill="#f5e9f4"/>
<text x="568" y="58" font-size="13" text-anchor="start" fill="#8a3b86" font-weight="700">AVIRIS-NG</text>
<text x="568" y="88" font-size="10.5" text-anchor="start" fill="#7d858f">bands</text>
<text x="644" y="88" font-size="10.5" text-anchor="start" fill="#1f2328">372 of 425 (bbl)</text>
<text x="568" y="109" font-size="10.5" text-anchor="start" fill="#7d858f">aligned to</text>
<text x="644" y="109" font-size="10.5" text-anchor="start" fill="#1f2328">aviris_ng_372.json</text>
<text x="568" y="130" font-size="10.5" text-anchor="start" fill="#7d858f">pixel</text>
<text x="644" y="130" font-size="10.5" text-anchor="start" fill="#1f2328">3.2-8.2 m (0.4-1 km)</text>
<text x="568" y="151" font-size="10.5" text-anchor="start" fill="#7d858f">train / test</text>
<text x="644" y="151" font-size="10.5" text-anchor="start" fill="#1f2328">22,377 / 2,270</text>
<text x="568" y="172" font-size="10.5" text-anchor="start" fill="#7d858f">split by</text>
<text x="644" y="172" font-size="10.5" text-anchor="start" fill="#1f2328">15 km site</text>
<text x="568" y="193" font-size="10.5" text-anchor="start" fill="#7d858f">labels</text>
<text x="644" y="193" font-size="10.5" text-anchor="start" fill="#1f2328">none</text>
<text x="568" y="214" font-size="10.5" text-anchor="start" fill="#7d858f"></text>
<text x="644" y="214" font-size="10.5" text-anchor="start" fill="#1f2328"></text>
<text x="568" y="235" font-size="10.5" text-anchor="start" fill="#7d858f">quirk</text>
<text x="644" y="235" font-size="10.5" text-anchor="start" fill="#1f2328">4 product versions</text>
<text x="18" y="284" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">b  Alignment by wavelength, 0.5 nm tolerance (band_alignment.py)</text>
<text x="20" y="315" font-size="11" text-anchor="start" fill="#4b535d">sample's bands</text>
<text x="20" y="385" font-size="11" text-anchor="start" fill="#4b535d">target list</text>
<rect x="130" y="298" width="68" height="26" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="164" y="315" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">500.2</text>
<rect x="214" y="298" width="68" height="26" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="248" y="315" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">520.1</text>
<rect x="298" y="298" width="68" height="26" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="332" y="315" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">530.0</text>
<rect x="130" y="368" width="68" height="26" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="164" y="385" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">500</text>
<rect x="214" y="368" width="68" height="26" rx="4" fill="#f2f4f6"/>
<rect x="214" y="368" width="68" height="26" rx="4" fill="url(#hatch)" stroke="#8f979f" stroke-width="1.3"/>
<text x="248" y="385" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">510</text>
<rect x="298" y="368" width="68" height="26" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="332" y="385" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">520</text>
<line x1="164" y1="324" x2="164" y2="366" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<line x1="248" y1="324" x2="330" y2="366" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<text x="332" y="342" font-size="10.5" text-anchor="start" fill="#7d858f">530: no target band - dropped</text>
<text x="232" y="410" font-size="10.5" text-anchor="start" fill="#7d858f">510: nothing within 0.5 nm - nodata (hatched), skipped exactly by the stem</text>
<text x="560" y="308" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">Every training batch:</text>
<text x="560" y="328" font-size="11" text-anchor="start" fill="#4b535d">one sensor, drawn by share</text>
<text x="560" y="346" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">EnMAP 0.40 / PRISMA 0.35 / AVIRIS-NG 0.25</text>
<text x="560" y="366" font-size="11" text-anchor="start" fill="#4b535d">every sample aligned to that sensor's list</text>
<text x="560" y="384" font-size="11" text-anchor="start" fill="#4b535d">so the stem gets one (N,) wavelength list</text>
</svg>
