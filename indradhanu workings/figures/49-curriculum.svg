<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The fine-tuning curriculum: stages, what each trains, and its gate">
<title>The fine-tuning curriculum: stages, what each trains, and its gate</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
<text x="18" y="24" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">a  Six stages; each must pass its gate before the next starts</text>
<rect x="20" y="40" width="136" height="100" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="30" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">0  Setup</text>
<text x="30" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">nothing trains</text>
<text x="30" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">code, tests,</text>
<text x="30" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">label policy</text>
<rect x="20" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="88" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">tests pass;</text>
<text x="88" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">thresholds fixed</text>
<line x1="88" y1="140" x2="88" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="157" y1="90" x2="165" y2="90" stroke="#4b535d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="166" y="40" width="136" height="100" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="176" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">1  Probe</text>
<text x="176" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">seg head only</text>
<text x="176" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">backbone frozen</text>
<text x="176" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">EnMAP</text>
<rect x="166" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="234" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">IoU recorded on</text>
<text x="234" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">EnMAP test datatakes</text>
<line x1="234" y1="140" x2="234" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="303" y1="90" x2="311" y2="90" stroke="#4b535d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="312" y="40" width="136" height="100" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="322" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">2  Adapt</text>
<text x="322" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">stem, encoder,</text>
<text x="322" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">recon decoder</text>
<text x="322" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">all 3 sensors</text>
<rect x="312" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="380" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">bench &gt;= 0.861;</text>
<text x="380" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">recon error falls</text>
<line x1="380" y1="140" x2="380" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="449" y1="90" x2="457" y2="90" stroke="#4b535d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="458" y="40" width="136" height="100" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="468" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">3  Joint</text>
<text x="468" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">everything</text>
<text x="468" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">recon + seg loss</text>
<text x="468" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">seg on EnMAP</text>
<rect x="458" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="526" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">bench &gt;= stage 2;</text>
<text x="526" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">IoU &gt; stage 1</text>
<line x1="526" y1="140" x2="526" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="595" y1="90" x2="603" y2="90" stroke="#4b535d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="604" y="40" width="136" height="100" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="614" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">4  Pseudo-labels</text>
<text x="614" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">as stage 3, plus</text>
<text x="614" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">confident PRISMA /</text>
<text x="614" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">AVIRIS-NG labels</text>
<rect x="604" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="672" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">IoU and bench</text>
<text x="672" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">hold (optional)</text>
<line x1="672" y1="140" x2="672" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="741" y1="90" x2="749" y2="90" stroke="#4b535d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="750" y="40" width="136" height="100" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="760" y="60" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">5  Product</text>
<text x="760" y="82" font-size="10.5" text-anchor="start" fill="#4b535d">masks replace</text>
<text x="760" y="98" font-size="10.5" text-anchor="start" fill="#4b535d">threshold rules;</text>
<text x="760" y="114" font-size="10.5" text-anchor="start" fill="#4b535d">class-aware scoring</text>
<rect x="750" y="158" width="136" height="48" rx="5" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="818" y="177" font-size="10.5" text-anchor="middle" fill="#4b535d">ships only if it</text>
<text x="818" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d">beats the default</text>
<line x1="818" y1="140" x2="818" y2="156" stroke="#b45f06" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<text x="20" y="226" font-size="10.5" text-anchor="start" fill="#7d858f">bench = mean ROC-AUC on the four labelled PRISMA scenes with residual Mahalanobis; 0.861 is F001 at epoch 60.</text>
<text x="18" y="262" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">b  Batches drawn by share, not by how many tiles each sensor has</text>
<text x="158" y="297" font-size="11" text-anchor="end" fill="#4b535d">by share (start)</text>
<rect x="170" y="278" width="238" height="28" rx="2" fill="#0f766e"/>
<text x="290" y="296" font-size="10.5" text-anchor="middle" fill="#ffffff">EnMAP 40%</text>
<rect x="410" y="278" width="208" height="28" rx="2" fill="#3a4aa8"/>
<text x="515" y="296" font-size="10.5" text-anchor="middle" fill="#ffffff">PRISMA 35%</text>
<rect x="620" y="278" width="148" height="28" rx="2" fill="#8a3b86"/>
<text x="695" y="296" font-size="10.5" text-anchor="middle" fill="#ffffff">AVIRIS-NG 25%</text>
<text x="158" y="337" font-size="11" text-anchor="end" fill="#4b535d">by tile count</text>
<rect x="170" y="318" width="166.6" height="28" rx="2" fill="#0f766e"/>
<text x="254.3" y="336" font-size="10.5" text-anchor="middle" fill="#ffffff">EnMAP 28.1%</text>
<rect x="338.6" y="318" width="169.6" height="28" rx="2" fill="#3a4aa8"/>
<text x="424.4" y="336" font-size="10.5" text-anchor="middle" fill="#ffffff">PRISMA 28.6%</text>
<rect x="510.2" y="318" width="257.8" height="28" rx="2" fill="#8a3b86"/>
<text x="640.1" y="336" font-size="10.5" text-anchor="middle" fill="#ffffff">AVIRIS-NG 43.3%</text>
<text x="20" y="370" font-size="10" text-anchor="start" fill="#7d858f" font-style="italic">Tile counts: 14,542 + 14,802 + 22,377 = 51,721 training tiles. Shares are tuned only on the stage gates.</text>
</svg>
