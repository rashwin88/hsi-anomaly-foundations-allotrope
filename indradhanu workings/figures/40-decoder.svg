<path d="M53,228 C53,262 120,262 300,262 L560,262 C640,262 662,220 664,157" fill="none" stroke="#3a4aa8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<circle cx="720" cy="140" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
<text x="720" y="145" font-size="16" text-anchor="middle" fill="#1f2328" font-weight="600">+</text>
<line x1="680" y1="140" x2="705" y2="140" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<path d="M620,175 C690,180 718,170 720,155" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<line x1="733" y1="140" x2="760" y2="140" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="780" y="136" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="600">out_n</text>
<text x="780" y="152" font-size="11" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(N,)</text>
<text x="410" y="292" font-size="11.5" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">out_n = U(lambda_n) . z + c(lambda_n)    -  no attention, no stored per-band weights</text>
</svg>
