<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The SAM weight ramp">
<title>The SAM weight ramp</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="860" height="270" fill="#ffffff"/>
<line x1="70" y1="210" x2="590" y2="210" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="214" font-size="10.5" text-anchor="end" fill="#4b535d">0.0</text>
<line x1="70" y1="181.667" x2="590" y2="181.667" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="185.667" font-size="10.5" text-anchor="end" fill="#4b535d">0.1</text>
<line x1="70" y1="153.333" x2="590" y2="153.333" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="157.333" font-size="10.5" text-anchor="end" fill="#4b535d">0.2</text>
<line x1="70" y1="125" x2="590" y2="125" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="129" font-size="10.5" text-anchor="end" fill="#4b535d">0.3</text>
<line x1="70" y1="96.6667" x2="590" y2="96.6667" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="100.667" font-size="10.5" text-anchor="end" fill="#4b535d">0.4</text>
<line x1="70" y1="68.3333" x2="590" y2="68.3333" stroke="#d5dae0" stroke-width="0.8" stroke-linecap="round"/>
<text x="62" y="72.3333" font-size="10.5" text-anchor="end" fill="#4b535d">0.5</text>
<text x="70" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">0</text>
<text x="156.667" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">5</text>
<text x="243.333" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">10</text>
<text x="330" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">15</text>
<text x="416.667" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">20</text>
<text x="503.333" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">25</text>
<text x="590" y="228" font-size="10.5" text-anchor="middle" fill="#4b535d">30</text>
<text x="330" y="246" font-size="11" text-anchor="middle" fill="#4b535d">epoch index t (0-based)</text>
<text x="20" y="26" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">lambda(t)</text>
<path d="M70.0,210.0 L87.3,195.8 L104.7,181.7 L122.0,167.5 L139.3,153.3 L156.7,139.2 L174.0,125.0 L191.3,110.8 L208.7,96.7 L226.0,82.5 L243.3,68.3 L260.7,68.3 L278.0,68.3 L295.3,68.3 L312.7,68.3 L330.0,68.3 L347.3,68.3 L364.7,68.3 L382.0,68.3 L399.3,68.3 L416.7,68.3 L434.0,68.3 L451.3,68.3 L468.7,68.3 L486.0,68.3 L503.3,68.3 L520.7,68.3 L538.0,68.3 L555.3,68.3 L572.7,68.3 L590.0,68.3" fill="none" stroke="#b45f06" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70" cy="210" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="1.6"/>
<text x="62" y="204" font-size="10.5" text-anchor="end" fill="#b45f06"></text>
<circle cx="156.667" cy="139.167" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="1.6"/>
<text x="148.667" y="133.167" font-size="10.5" text-anchor="end" fill="#b45f06">0.25</text>
<circle cx="243.333" cy="68.3333" r="3.5" fill="#ffffff" stroke="#b45f06" stroke-width="1.6"/>
<text x="235.333" y="62.3333" font-size="10.5" text-anchor="end" fill="#b45f06">0.50</text>
<line x1="243.333" y1="40" x2="243.333" y2="210" stroke="#4b535d" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="249.333" y="90" font-size="10.5" text-anchor="start" fill="#4b535d">ramp ends</text>
<text x="620" y="70" font-size="11.5" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">lambda(t) = 0.5 x min(1, t / 10)</text>
<text x="620" y="100" font-size="11.5" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">loss = L1 + lambda(t) x SAM</text>
<text x="620" y="136" font-size="11" text-anchor="start" fill="#4b535d">Early on, SAM's gradients are</text>
<text x="620" y="152" font-size="11" text-anchor="start" fill="#4b535d">noisy, so L1 leads; the angle</text>
<text x="620" y="168" font-size="11" text-anchor="start" fill="#4b535d">term is phased in over 10 epochs.</text>
<text x="620" y="200" font-size="10.5" text-anchor="start" fill="#7d858f">v0.2.0: sam_weight 0.5,</text>
<text x="620" y="214" font-size="10.5" text-anchor="start" fill="#7d858f">sam_ramp_epochs 10</text>
</svg>
