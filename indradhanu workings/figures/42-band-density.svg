<text x="650" y="72.74285714285716" font-size="10.5" text-anchor="middle" fill="#1f2328">0.0309</text>
<text x="650" y="236" font-size="10.5" text-anchor="middle" fill="#1f2328">thinned to</text>
<text x="650" y="250" font-size="10.5" text-anchor="middle" fill="#4b535d">PRISMA spacing</text>
<rect x="724" y="127.2" width="52" height="92.8" rx="4" fill="#4b535d"/>
<text x="750" y="121.20000000000002" font-size="10.5" text-anchor="middle" fill="#1f2328">0.0203</text>
<text x="750" y="236" font-size="10.5" text-anchor="middle" fill="#1f2328">thinned +</text>
<text x="750" y="250" font-size="10.5" text-anchor="middle" fill="#4b535d">skip reweighted</text>
<line x1="500" y1="220" x2="800" y2="220" stroke="#4b535d" stroke-width="1"/>
<text x="20" y="290" font-size="10" text-anchor="start" fill="#7d858f" font-style="italic">Same pixels in every bar; only the band list changes. E004 epoch 18, measured 2026-10-14.</text>
</svg>
