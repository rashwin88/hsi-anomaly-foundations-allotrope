<text x="30" y="246" font-size="11" text-anchor="start" fill="#4b535d">exp(-inf) = 0, so the dead band's weight is exactly 0 and the others grow to sum to 1.</text>
<text x="30" y="264" font-size="11" text-anchor="start" fill="#4b535d">On the real module, a dead band holding 99.0 changed the output by 0.0; unmasked, by 3.11.</text>
