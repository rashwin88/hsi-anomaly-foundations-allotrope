<text x="780" y="140" font-size="10.5" text-anchor="start" fill="#7d858f">(next Action)</text>
<text x="20" y="32" font-size="12" text-anchor="start" fill="#1f2328" font-weight="600">combined (the default): L1 and SAM are scaled to 0-1 by their scene maxima, then blended.</text>
<text x="20" y="236" font-size="11" text-anchor="start" fill="#4b535d">Worked: max L1 = 0.05, max SAM = 0.40 rad; a pixel with L1 0.025 and SAM 0.10 gives l1n = 0.50, samn = 0.25,</text>
<text x="20" y="252" font-size="11" text-anchor="start" fill="#4b535d">score = 0.5 x 0.50 + 0.5 x 0.25 = 0.375. The weight is sam_l1_alpha. One extreme pixel sets the max, so the scaling is fragile.</text>
