<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Self-attention against cross-attention over a pixel's bands">
<title>Self-attention against cross-attention over a pixel's bands</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
<text x="20" y="26" font-size="12.5" text-anchor="start" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="700">a  Self: the tokens ask</text>
<rect x="30" y="60" width="100" height="34" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="80" y="80.96" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">N band tokens</text>
<line x1="130" y1="77" x2="170" y2="52" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="40" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="55" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">Q</text>
<line x1="130" y1="77" x2="170" y2="78" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="66" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="81" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">K</text>
<line x1="130" y1="77" x2="170" y2="104" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="92" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="107" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">V</text>
<text x="20" y="150" font-size="12.5" text-anchor="start" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="700">b  Cross: someone else asks</text>
<rect x="30" y="176" width="100" height="34" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="80" y="196.96" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">D queries</text>
<rect x="30" y="222" width="100" height="34" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="80" y="242.96" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">N band tokens</text>
<line x1="130" y1="193" x2="170" y2="193" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="182" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="197" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">Q</text>
<line x1="130" y1="239" x2="170" y2="226" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="216" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="231" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">K</text>
<line x1="130" y1="239" x2="170" y2="252" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="172" y="242" width="28" height="22" rx="3" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1"/>
<text x="186" y="257" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">V</text>
<rect x="300" y="60" width="202" height="202" rx="1" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.2"/>
<text x="401" y="50" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">self: N x N = 202 x 202</text>
<text x="401" y="180" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">40,804 scores</text>
<text x="401" y="196" font-size="10.5" text-anchor="middle" fill="#4b535d">per pixel, per head</text>
<rect x="560" y="60" width="202" height="32" rx="1" fill="#c99ac6" stroke="#8a3b86" stroke-width="1.2"/>
<text x="661" y="50" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cross: D x N = 32 x 202</text>
<text x="661" y="114" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">6,464 scores</text>
<text x="661" y="130" font-size="10.5" text-anchor="middle" fill="#4b535d">6.3 times fewer; grows with N, not N squared</text>
<text x="560" y="170" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">Output count</text>
<text x="560" y="190" font-size="11" text-anchor="start" fill="#4b535d">self: N outputs, one per token</text>
<text x="560" y="208" font-size="11" text-anchor="start" fill="#4b535d">cross: D outputs, one per query -</text>
<text x="560" y="224" font-size="11" text-anchor="start" fill="#4b535d">fixed, however many bands arrive</text>
<text x="300" y="300" font-size="10" text-anchor="start" fill="#7d858f" font-style="italic">Rectangles drawn to scale: one unit per band or query.</text>
</svg>
