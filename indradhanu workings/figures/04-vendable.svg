<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="How a vendable reaches Indradhanu">
<title>How a vendable reaches Indradhanu</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
<rect x="10" y="60" width="112" height="50" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="66" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">raw satellite file</text>
<text x="66" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HDF5 / GeoTIFF</text>
<line x1="122" y1="85" x2="160" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="141" y="76" font-size="10" text-anchor="middle" fill="#4b535d">onboard</text>
<rect x="162" y="60" width="132" height="50" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="228" y="82" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">onboarding vendable</text>
<text x="228" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">native bands</text>
<line x1="294" y1="85" x2="372" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="333" y="66" font-size="10" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">band_filter</text>
<text x="333" y="78" font-size="10" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">_apply</text>
<rect x="374" y="30" width="300" height="222" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<rect x="374" y="30" width="300" height="30" rx="8" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.4"/>
<rect x="375" y="50" width="298" height="10" rx="0" fill="#e3f3f1"/>
<text x="524" y="50" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="700">filtered vendable (165 bands)</text>
<text x="388" y="84" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="600">normalized_hyperspectral_cube</text>
<text x="662" y="84" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165, H, W)</text>
<text x="388" y="107" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="600">validity_cube</text>
<text x="662" y="107" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165, H, W)</text>
<text x="388" y="130" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">band_cw_order</text>
<text x="662" y="130" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165,)</text>
<text x="388" y="153" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">band_fwhm_order</text>
<text x="662" y="153" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165,)</text>
<text x="388" y="176" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">spectral_family_order</text>
<text x="662" y="176" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165,)</text>
<text x="388" y="199" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">band_validity_by_position</text>
<text x="662" y="199" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165,)</text>
<text x="388" y="222" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">band_level_validity_score</text>
<text x="662" y="222" font-size="10.5" text-anchor="end" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165,)</text>
<line x1="386" y1="120" x2="662" y2="120" stroke="#d5dae0" stroke-width="1.2" stroke-linecap="round"/>
<text x="524" y="246" font-size="10" text-anchor="middle" fill="#7d858f" font-style="italic">no CRS, no affine: recovered at export</text>
<line x1="674" y1="85" x2="720" y2="85" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="722" y="60" width="140" height="50" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="792" y="82" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="600">Indradhanu</text>
<text x="792" y="97" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(165, H, W) in</text>
<path d="M674,108 C700,108 700,190 722,190" fill="none" stroke="#8f979f" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-grey)"/>
<rect x="722" y="165" width="140" height="50" rx="6" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.3"/>
<text x="792" y="187" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">spatial_valid</text>
<text x="792" y="202" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">sum(axis=0) &gt; 0</text>
<text x="792" y="232" font-size="11" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(H, W)</text>
<text x="20" y="160" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">Raw files never reach the model.</text>
<text x="20" y="177" font-size="11" text-anchor="start" fill="#4b535d">Every sensor is resampled onto the</text>
<text x="20" y="192" font-size="11" text-anchor="start" fill="#4b535d">same 165 wavelengths first (part 03).</text>
</svg>
