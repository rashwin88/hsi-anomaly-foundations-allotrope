<text x="20" y="30" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="600">At every pixel: 165 numbers become 32 learned mixtures; 32 become 165 again at the end.</text>
<text x="20" y="48" font-size="11" text-anchor="start" fill="#4b535d">The 48-track mixdown to stereo and back: the transformer between them works on 32 channels, not 165.</text>
