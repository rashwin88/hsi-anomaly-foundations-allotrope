<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One shared encoder, two passes: masked for reconstruction, unmasked for segmentation">
<title>One shared encoder, two passes: masked for reconstruction, unmasked for segmentation</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
<rect x="18" y="140" width="132" height="62" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="84" y="162" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">reflectance</text>
<text x="84" y="178" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(B, N, 128, 128)</text>
<text x="84" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">+ wavelengths (N,)</text>
<rect x="176" y="140" width="120" height="62" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="236" y="162" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">stem in</text>
<text x="236" y="178" font-size="10.5" text-anchor="middle" fill="#4b535d">+ BatchNorm</text>
<text x="236" y="193" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(B, 32, 128, 128)</text>
<line x1="150" y1="171" x2="174" y2="171" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="340" y="40" width="150" height="62" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="415" y="64" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">encoder pass 1</text>
<text x="415" y="82" font-size="10.5" text-anchor="middle" fill="#4b535d">65% of tokens removed</text>
<rect x="340" y="240" width="150" height="62" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="415" y="264" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">encoder pass 2</text>
<text x="415" y="282" font-size="10.5" text-anchor="middle" fill="#4b535d">every token kept</text>
<path d="M296,160 C318,160 316,71 338,71" fill="none" stroke="#3a4aa8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<path d="M296,182 C318,182 316,271 338,271" fill="none" stroke="#3a4aa8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<line x1="415" y1="104" x2="415" y2="238" stroke="#3a4aa8" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="424" y="160" font-size="10.5" text-anchor="start" fill="#3a4aa8">same weights</text>
<text x="424" y="176" font-size="10.5" text-anchor="start" fill="#3a4aa8">F1..F4 features</text>
<rect x="530" y="40" width="150" height="62" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="605" y="64" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">reconstruction</text>
<text x="605" y="81" font-size="10.5" text-anchor="middle" fill="#4b535d">decoder + stem out</text>
<text x="605" y="95" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(B, N, 128, 128)</text>
<rect x="530" y="240" width="150" height="62" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="605" y="262" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">segmentation head</text>
<text x="605" y="278" font-size="10.5" text-anchor="middle" fill="#4b535d">SegFormerDecoder, 128</text>
<text x="605" y="293" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">371,536 parameters</text>
<line x1="490" y1="71" x2="528" y2="71" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<line x1="490" y1="271" x2="528" y2="271" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<rect x="722" y="40" width="160" height="62" rx="6" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="802" y="64" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">L1 + lambda x SAM</text>
<text x="802" y="81" font-size="10.5" text-anchor="middle" fill="#4b535d">on hidden pixels</text>
<text x="802" y="95" font-size="10.5" text-anchor="middle" fill="#4b535d">all three sensors</text>
<rect x="722" y="240" width="160" height="62" rx="6" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="802" y="260" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">BCE + Dice</text>
<text x="802" y="276" font-size="10.5" text-anchor="middle" fill="#4b535d">5 sigmoids, known pixels</text>
<text x="802" y="291" font-size="10.5" text-anchor="middle" fill="#4b535d">EnMAP batches only</text>
<line x1="680" y1="71" x2="720" y2="71" stroke="#b45f06" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="680" y1="271" x2="720" y2="271" stroke="#b45f06" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<text x="700" y="140" font-size="11" text-anchor="start" fill="#4b535d">probe: pass 2 only (backbone frozen)</text>
<text x="700" y="158" font-size="11" text-anchor="start" fill="#4b535d">adapt: pass 1 only</text>
<text x="700" y="176" font-size="11" text-anchor="start" fill="#4b535d">joint: both; loss =</text>
<text x="700" y="194" font-size="11" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">  recon + seg_weight x seg</text>
<text x="20" y="350" font-size="10" text-anchor="start" fill="#7d858f" font-style="italic">Classes: water, cloud, thin_cloud, shadow, snow - one logit each, (B, 5, 128, 128).</text>
</svg>
