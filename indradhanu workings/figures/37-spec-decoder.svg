<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The cross-attention spectral decoder: wavelengths ask, channels answer">
<title>The cross-attention spectral decoder: wavelengths ask, channels answer</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="20" y="26" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Keys and values: the pixel's 32 channels</text>
<rect x="30" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="56" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="82" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="108" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="134" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="160" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="186" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<rect x="212" y="50" width="22" height="22" rx="2" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="250" y="66" font-size="11" text-anchor="start" fill="#4b535d">... 32</text>
<line x1="130" y1="74" x2="130" y2="100" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<rect x="40" y="102" width="200" height="46" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="140" y="122" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">channel value stretch</text>
<text x="140" y="137" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">+ learned identity (32, 32)</text>
<line x1="240" y1="125" x2="296" y2="125" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="298" y="100" width="130" height="50" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="363" y="122" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">K, V</text>
<text x="363" y="137" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(4, 32, 8)</text>
<text x="20" y="196" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Queries: one per requested wavelength</text>
<rect x="24" y="212" width="54" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="51" y="229" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">418 nm</text>
<rect x="84" y="212" width="54" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="111" y="229" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">864 nm</text>
<text x="170" y="230" font-size="13" text-anchor="middle" fill="#4b535d">...</text>
<rect x="204" y="212" width="54" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="231" y="229" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">2445 nm</text>
<line x1="274" y1="225" x2="296" y2="225" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="298" y="200" width="130" height="50" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="363" y="222" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">tag -&gt; Linear -&gt; Q</text>
<text x="363" y="237" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(4, N, 8)</text>
<line x1="428" y1="125" x2="470" y2="160" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<line x1="428" y1="225" x2="470" y2="190" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="472" y="150" width="150" height="50" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="547" y="172" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">attention, 4 heads</text>
<text x="547" y="187" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">N x 32 scores/head</text>
<line x1="622" y1="175" x2="652" y2="175" stroke="#8a3b86" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-plum)"/>
<rect x="654" y="150" width="110" height="50" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="709" y="172" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">to_value</text>
<text x="709" y="187" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Linear(32, 1)</text>
<line x1="764" y1="175" x2="792" y2="175" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<text x="830" y="171" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">N bands</text>
<text x="830" y="187" font-size="11" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(N,)</text>
<text x="472" y="240" font-size="10.5" text-anchor="start" fill="#4b535d">6,401 parameters for any N: ask 202, 224, 239</text>
<text x="472" y="256" font-size="10.5" text-anchor="start" fill="#4b535d">or 425 wavelengths with the same weights.</text>
<text x="472" y="286" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Part 40 replaces this with a linear per-band readout.</text>
</svg>
