<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Per-pixel gating in front of the fixed mixdown">
<title>Per-pixel gating in front of the fixed mixdown</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="280" fill="#ffffff"/>
<rect x="20" y="110" width="90" height="44" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="65" y="129" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="600">x</text>
<text x="65" y="144" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(202,)</text>
<line x1="110" y1="132" x2="150" y2="80" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="152" y="56" width="300" height="44" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="302" y="75" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="600">Linear(202,32) - GELU - Linear(32,202)</text>
<text x="302" y="90" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">scores z, 13,162 parameters</text>
<line x1="452" y1="78" x2="490" y2="78" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="492" y="56" width="110" height="44" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="547" y="75" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">sigmoid</text>
<text x="547" y="90" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">g in (0, 1)</text>
<circle cx="547" cy="132" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
<text x="547" y="137" font-size="14" text-anchor="middle" fill="#1f2328" font-weight="600">x</text>
<line x1="547" y1="100" x2="547" y2="117" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<line x1="110" y1="132" x2="532" y2="132" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<line x1="560" y1="132" x2="610" y2="132" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="612" y="110" width="140" height="44" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="682" y="129" font-size="12" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">W  (32, 202)</text>
<text x="682" y="144" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">today's 1x1 conv</text>
<line x1="752" y1="132" x2="790" y2="132" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<text x="830" y="128" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="600">y</text>
<text x="830" y="144" font-size="11" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(32,)</text>
<text x="20" y="200" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">Each pixel's recipe is W . diag(g): today's W with its columns rescaled by that pixel's own faders.</text>
<text x="20" y="220" font-size="11" text-anchor="start" fill="#4b535d">Worked (part 10's pixel): z = [-2, -2, 2, 2] gives g = [0.12, 0.12, 0.88, 0.88], and y0 falls from 1.1 to 0.132.</text>
<text x="20" y="238" font-size="11" text-anchor="start" fill="#4b535d">Sigmoid never reaches 0: a dead band holding 99 with z = -5 still leaks 0.0067 x 99 = 0.66 into the mix.</text>
<text x="20" y="264" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Cost per pixel: 12,928 for the gate + 6,464 for W = 19,392 multiply-adds, three times today's compressor.</text>
</svg>
