<text x="410" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">rotate if needed</text>
<text x="410" y="301" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">swap staged folder</text>
<line x1="480" y1="289" x2="490" y2="289" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="492" y="266" width="136" height="46" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="560" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">prefetch block k+1</text>
<text x="560" y="301" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">in background</text>
<line x1="630" y1="289" x2="640" y2="289" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="642" y="266" width="136" height="46" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="710" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">train, auto_resume</text>
<text x="710" y="301" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">stop at 20(k+1)</text>
<path d="M710.0,312 L710.0,330 L110.0,330 L110.0,316" fill="none" stroke="#4b535d" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="410" y="344" font-size="10.5" text-anchor="middle" fill="#4b535d">the trainer writes the epoch's metrics.csv row only after its checkpoint is in S3, so stopping there loses nothing</text>
<text x="20" y="362" font-size="10" text-anchor="start" fill="#7d858f" font-style="italic">Epoch 20k's row exists, then SIGTERM; the next start resumes from last.pt with optimizer, scheduler and early-stop state.</text>
</svg>
