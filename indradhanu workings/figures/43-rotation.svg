<text x="430" y="212" font-size="11" text-anchor="middle" fill="#4b535d" xml:space="preserve" style="white-space:pre">epoch   (block k trains epochs 20k+1 to 20k+20)</text>
<line x1="250" y1="182" x2="250" y2="222" stroke="#0f766e" stroke-width="1" stroke-linecap="round"/>
<text x="256" y="226" font-size="10.5" text-anchor="start" fill="#0f766e">block 2 = shards 400-599</text>
<text x="18" y="252" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">b  The driver loop (rotate_f001.sh): everything derived from metrics.csv, so it survives a restart</text>
<rect x="42" y="266" width="136" height="46" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="110" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">count epochs done</text>
<text x="110" y="301" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rows - 1</text>
<line x1="180" y1="289" x2="190" y2="289" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="192" y="266" width="136" height="46" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="260" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">pick the block</text>
<text x="260" y="301" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">k = done // 20</text>
