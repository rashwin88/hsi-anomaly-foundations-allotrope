<text x="30" y="30" font-size="12" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">x = x + Dropout(ESA(LayerNorm(x)))      x = x + Dropout(MixFFN(LayerNorm(x)))</text>
<text x="30" y="232" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Normalise first (pre-norm), transform, add back. Shape is unchanged; each stage stacks two blocks.</text>
