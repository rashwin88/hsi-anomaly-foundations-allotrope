<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Four fine-tuning options discussed on 2026-10-16 and their status">
<title>Four fine-tuning options discussed on 2026-10-16 and their status</title>
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="18.0" y="24.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700" xml:space="preserve" style="white-space:pre">Options discussed after FT02 (2026-10-16)</text>
<rect x="20.0" y="44.0" width="204.0" height="200.0" rx="6" fill="#ffffff" stroke="#8a3b86" stroke-width="1.4"/>
<text x="32.0" y="68.0" font-size="11.5" text-anchor="start" fill="#8a3b86" font-weight="700" xml:space="preserve" style="white-space:pre">Teacher (oracle) head</text>
<text x="32.0" y="96.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">EMA teacher on the full band list</text>
<text x="32.0" y="112.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">teaches a student on a degraded list</text>
<text x="32.0" y="146.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">cost: second pass, second copy</text>
<rect x="30.0" y="190.0" width="184.0" height="38.0" rx="4" fill="#f2f4f6" stroke="#8a3b86" stroke-width="1"/>
<text x="122.0" y="213.0" font-size="10" text-anchor="middle" fill="#8a3b86" font-weight="700" xml:space="preserve" style="white-space:pre">deferred - after mixed batches</text>
<rect x="238.0" y="44.0" width="204.0" height="200.0" rx="6" fill="#ffffff" stroke="#3a4aa8" stroke-width="1.4"/>
<text x="250.0" y="68.0" font-size="11.5" text-anchor="start" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">Per-sensor heads</text>
<text x="250.0" y="96.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">own output per sensor</text>
<text x="250.0" y="112.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">more capacity per sensor</text>
<text x="250.0" y="146.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">cost: no longer any band list</text>
<rect x="248.0" y="190.0" width="184.0" height="38.0" rx="4" fill="#f2f4f6" stroke="#3a4aa8" stroke-width="1"/>
<text x="340.0" y="213.0" font-size="10" text-anchor="middle" fill="#3a4aa8" font-weight="700" xml:space="preserve" style="white-space:pre">discussed, not chosen</text>
<rect x="456.0" y="44.0" width="204.0" height="200.0" rx="6" fill="#ffffff" stroke="#b45f06" stroke-width="1.4"/>
<text x="468.0" y="68.0" font-size="11.5" text-anchor="start" fill="#b45f06" font-weight="700" xml:space="preserve" style="white-space:pre">Synthetic-target head</text>
<text x="468.0" y="96.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">implant targets, train to find them</text>
<text x="468.0" y="112.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">detection as a training signal</text>
<text x="468.0" y="146.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">cost: learns the recipe</text>
<rect x="466.0" y="190.0" width="184.0" height="38.0" rx="4" fill="#f2f4f6" stroke="#b45f06" stroke-width="1"/>
<text x="558.0" y="213.0" font-size="10" text-anchor="middle" fill="#b45f06" font-weight="700" xml:space="preserve" style="white-space:pre">discussed, not chosen</text>
<rect x="674.0" y="44.0" width="204.0" height="200.0" rx="6" fill="#ffffff" stroke="#8f979f" stroke-width="1.4"/>
<text x="686.0" y="68.0" font-size="11.5" text-anchor="start" fill="#8f979f" font-weight="700" xml:space="preserve" style="white-space:pre">Regularisation</text>
<text x="686.0" y="96.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">EMA, SpectralEarth replay,</text>
<text x="686.0" y="112.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">lower LR, L2-SP</text>
<text x="686.0" y="146.0" font-size="10" text-anchor="start" fill="#4b535d" xml:space="preserve" style="white-space:pre">answers forgetting - not seen</text>
<rect x="684.0" y="190.0" width="184.0" height="38.0" rx="4" fill="#f2f4f6" stroke="#8f979f" stroke-width="1"/>
<text x="776.0" y="213.0" font-size="10" text-anchor="middle" fill="#8f979f" font-weight="700" xml:space="preserve" style="white-space:pre">shelved</text>
<text x="20.0" y="278.0" font-size="10.5" text-anchor="start" fill="#7d858f" xml:space="preserve" style="white-space:pre">Taken: mixed-sensor batches (FT02b, running). Planned: edge term (FT02c).</text>
</svg>
