<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One fixed recipe for every pixel, and what a dead band does to it">
<title>One fixed recipe for every pixel, and what a dead band does to it</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="20" y="26" font-size="12.5" text-anchor="start" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="700">a  The same W mixes every pixel</text>
<rect x="30" y="56" width="90" height="34" rx="4" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.1"/>
<text x="75" y="77" font-size="11" text-anchor="middle" fill="#1f2328">forest pixel</text>
<line x1="120" y1="73" x2="194" y2="132" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="30" y="108" width="90" height="34" rx="4" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.1"/>
<text x="75" y="129" font-size="11" text-anchor="middle" fill="#1f2328">desert pixel</text>
<line x1="120" y1="125" x2="194" y2="132" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="30" y="160" width="90" height="34" rx="4" fill="#f2f4f6" stroke="#8f979f" stroke-width="1.1"/>
<text x="75" y="181" font-size="11" text-anchor="middle" fill="#1f2328">shadow pixel</text>
<line x1="120" y1="177" x2="194" y2="132" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="196" y="108" width="136" height="50" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="264" y="130" font-size="12" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">W  (32, 165)</text>
<text x="264" y="145" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">fixed after training</text>
<line x1="332" y1="133" x2="380" y2="70" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="382" y="56" width="70" height="30" rx="4" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="417" y="75" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">y (32,)</text>
<line x1="332" y1="133" x2="380" y2="122" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="382" y="108" width="70" height="30" rx="4" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="417" y="127" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">y (32,)</text>
<line x1="332" y1="133" x2="380" y2="174" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-teal)"/>
<rect x="382" y="160" width="70" height="30" rx="4" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1"/>
<text x="417" y="179" font-size="10.5" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">y (32,)</text>
<text x="30" y="228" font-size="11" text-anchor="start" fill="#4b535d">Training chooses W once; no pixel can change it.</text>
<text x="500" y="26" font-size="12.5" text-anchor="start" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="700">b  A dead band filled with 0.0 is mixed in anyway</text>
<text x="500" y="73" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">x        =</text>
<rect x="590" y="56" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="613" y="73" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1.2</text>
<rect x="642" y="56" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="665" y="73" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1.0</text>
<rect x="694" y="56" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="717" y="73" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">-0.4</text>
<rect x="746" y="56" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="769" y="73" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">-0.6</text>
<text x="500" y="109" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">x_broken =</text>
<rect x="590" y="92" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="613" y="109" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1.2</text>
<rect x="642" y="92" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="665" y="109" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1.0</text>
<rect x="694" y="92" width="46" height="26" rx="3" fill="#f2f4f6"/>
<rect x="694" y="92" width="46" height="26" rx="3" fill="url(#hatch)" stroke="#8f979f" stroke-width="1"/>
<text x="717" y="109" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0.0</text>
<rect x="746" y="92" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="769" y="109" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">-0.6</text>
<text x="500" y="145" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">W row 1  =</text>
<rect x="590" y="128" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="613" y="145" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>
<rect x="642" y="128" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="665" y="145" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>
<rect x="694" y="128" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="717" y="145" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0.5</text>
<rect x="746" y="128" width="46" height="26" rx="3" fill="#e3f3f1" stroke="#0f766e" stroke-width="1"/>
<text x="769" y="145" font-size="11" text-anchor="middle" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0.5</text>
<text x="500" y="190" font-size="11" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">true     y1 = 0.5 x (-0.4) + 0.5 x (-0.6) = -0.50</text>
<text x="500" y="210" font-size="11" text-anchor="start" fill="#b45f06" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve" style="white-space:pre">broken   y1 = 0.5 x 0.0    + 0.5 x (-0.6) = -0.30</text>
<text x="500" y="236" font-size="11" text-anchor="start" fill="#4b535d">one bad band moves the output by 0.20 (40%)</text>
<text x="20" y="280" font-size="10.5" text-anchor="start" fill="#7d858f" font-style="italic">Three limits follow: no per-pixel adaptation, no way to skip a band, and a weight per band position (only 165 bands).</text>
</svg>
