<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One epoch of the training loop">
<title>One epoch of the training loop</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#1f2328"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#0f766e"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#3a4aa8"/></marker><marker id="ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8a3b86"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#b45f06"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#8f979f"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#7d858f"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<rect x="20" y="40" width="560" height="230" rx="10" fill="#ffffff" stroke="#d5dae0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="34" y="60" font-size="11.5" text-anchor="start" fill="#1f2328" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="600">for each epoch</text>
<rect x="40" y="80" width="250" height="120" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="165" y="100" font-size="11.5" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">1  train pass  (model.train())</text>
<text x="56" y="122" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">random token mask (65%)</text>
<text x="56" y="137" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">forward -&gt; x_hat</text>
<text x="56" y="152" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">loss = L1 + lambda(t) x SAM</text>
<text x="56" y="167" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">loss / accum_steps; backward()</text>
<text x="56" y="182" font-size="10.5" text-anchor="start" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">every accum_steps: optimizer.step()</text>
<rect x="320" y="80" width="240" height="60" rx="6" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="440" y="107" font-size="11.5" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">2  validation pass</text>
<text x="440" y="122" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">model.eval(), two masks</text>
<rect x="320" y="150" width="115" height="50" rx="6" fill="#ffffff" stroke="#8f979f" stroke-width="1.3"/>
<text x="377.5" y="172" font-size="11" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">3  scheduler</text>
<text x="377.5" y="187" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.step()</text>
<rect x="445" y="150" width="115" height="50" rx="6" fill="#ffffff" stroke="#8f979f" stroke-width="1.3"/>
<text x="502.5" y="172" font-size="11" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">4  log</text>
<text x="502.5" y="187" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">L1, SAM, lambda</text>
<rect x="40" y="214" width="520" height="40" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="300" y="237.96" font-size="11" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">5  every save_every_n_epochs: checkpoint (weights, optimiser, scheduler)</text>
<line x1="290" y1="110" x2="318" y2="110" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<line x1="440" y1="140" x2="400" y2="148" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<line x1="435" y1="175" x2="443" y2="175" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<line x1="500" y1="200" x2="400" y2="212" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<path d="M30,234 L28,70 L36,70" fill="none" stroke="#4b535d" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="610" y="70" font-size="12" text-anchor="start" fill="#1f2328" font-weight="600">Gradient accumulation</text>
<text x="610" y="92" font-size="11" text-anchor="start" fill="#4b535d">backward() adds into .grad, so</text>
<text x="610" y="108" font-size="11" text-anchor="start" fill="#4b535d">4 small batches then one step act</text>
<text x="610" y="124" font-size="11" text-anchor="start" fill="#4b535d">like one batch 4 times larger.</text>
<text x="610" y="146" font-size="11" text-anchor="start" fill="#4b535d">Dividing each loss by accum_steps</text>
<text x="610" y="162" font-size="11" text-anchor="start" fill="#4b535d">keeps the learning rate's meaning.</text>
<text x="610" y="200" font-size="11" text-anchor="start" fill="#4b535d">Validation hides every valid token</text>
<text x="610" y="216" font-size="11" text-anchor="start" fill="#4b535d">once across two complementary</text>
<text x="610" y="232" font-size="11" text-anchor="start" fill="#4b535d">masks (part 25).</text>
</svg>
