<text x="857" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" xml:space="preserve" style="white-space:pre" font-weight="600">7  denormalise</text>
<text x="857" y="110" font-size="9.8" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">reflectance</text>
<text x="857" y="142" font-size="10" text-anchor="middle" fill="#7d858f">part 09</text>
<line x1="795" y1="97" x2="804" y2="97" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<text x="14" y="34" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="600">The model returns x_hat with exactly the input's shape; it never computes a loss or an anomaly score.</text>
<text x="14" y="186" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Inside step 4</text>
<rect x="120" y="170" width="130" height="54" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="185" y="190" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">stage 1</text>
<text x="185" y="205" font-size="10" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(4,1024,32)</text>
<text x="185" y="218" font-size="9.5" text-anchor="middle" fill="#4b535d">k4 s4, hide 65%</text>
<rect x="270" y="170" width="130" height="54" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
