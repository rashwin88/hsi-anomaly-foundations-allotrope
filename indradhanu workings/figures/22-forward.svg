<text x="292" y="110" font-size="9.8" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">z-score per band</text>
<text x="292" y="142" font-size="10" text-anchor="middle" fill="#7d858f">part 09</text>
