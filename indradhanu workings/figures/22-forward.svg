<text x="635" y="205" font-size="10" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">(4,16,256)</text>
<text x="635" y="218" font-size="9.5" text-anchor="middle" fill="#4b535d">k3 s2, R=1</text>
<line x1="552" y1="197" x2="568" y2="197" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<line x1="518" y1="150" x2="518" y2="168" stroke="#3a4aa8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 2"/>
<text x="14" y="268" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="700">Then the trainer</text>
<rect x="120" y="250" width="250" height="44" rx="6" fill="#fdf1e1" stroke="#b45f06" stroke-width="1.3"/>
<text x="245" y="269" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">L1 + lambda(t) x SAM</text>
<text x="245" y="284" font-size="10.5" text-anchor="middle" fill="#4b535d" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">on hidden, valid, eroded pixels</text>
<text x="390" y="268" font-size="10.5" text-anchor="start" fill="#4b535d">in raw reflectance space: an L1 of 0.008 means each band is off by 0.008</text>
<text x="390" y="284" font-size="10.5" text-anchor="start" fill="#7d858f">parts 23-25</text>
