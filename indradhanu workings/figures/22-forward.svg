<text x="335" y="218" font-size="9.5" text-anchor="middle" fill="#4b535d">k3 s2, R=4</text>
<line x1="252" y1="197" x2="268" y2="197" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
<rect x="420" y="170" width="130" height="54" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
