<text x="485" y="218" font-size="9.5" text-anchor="middle" fill="#4b535d">k3 s2, R=2</text>
<line x1="402" y1="197" x2="418" y2="197" stroke="#3a4aa8" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-indigo)"/>
