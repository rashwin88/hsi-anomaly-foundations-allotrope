<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="FT04 pseudo-label decision for one pixel, and the real-bench pAUC from shipped v0.2.0 to the release candidate">
<title>FT04 pseudo-label decision for one pixel, and the real-bench pAUC from shipped v0.2.0 to the release candidate</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 L2.2,5 Z" fill="#4b535d"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f979f" stroke-width="1.1"/></pattern></defs>
<rect x="0" y="0" width="900" height="370" fill="#ffffff"/>
<!-- panel a -->
<text x="18" y="24" font-size="12.5" fill="#1f2328" font-weight="700">(a) one teacher probability -&gt; one FT04 target (water and cloud only)</text>
<rect x="130" y="40" width="200" height="34" rx="4" fill="#ffffff" stroke="#4b535d" stroke-width="1.4"/>
<text x="230" y="61" font-size="11" text-anchor="middle" fill="#1f2328">FT03 says p = byte / 255</text>
<line x1="230" y1="74" x2="80" y2="112" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="230" y1="74" x2="230" y2="112" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="230" y1="74" x2="380" y2="112" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="118" y="96" font-size="10.5" text-anchor="end" fill="#4b535d">p &gt; 0.9</text>
<text x="236" y="98" font-size="10.5" fill="#4b535d">0.1 to 0.9</text>
<text x="338" y="96" font-size="10.5" fill="#4b535d">p &lt; 0.1</text>
<rect x="20" y="116" width="120" height="34" rx="4" fill="#ffffff" stroke="#4b535d" stroke-width="1.4"/>
<text x="80" y="131" font-size="10.5" text-anchor="middle" fill="#1f2328">confident yes</text>
<text x="80" y="144" font-size="10" text-anchor="middle" fill="#7d858f">byte 230 or more</text>
<rect x="170" y="116" width="120" height="34" rx="4" fill="url(#hatch)" stroke="#8f979f" stroke-width="1.4"/>
<rect x="178" y="124" width="104" height="18" fill="#ffffff"/>
<text x="230" y="137" font-size="10.5" text-anchor="middle" fill="#1f2328">unknown: no loss</text>
<rect x="320" y="116" width="120" height="34" rx="4" fill="#ffffff" stroke="#4b535d" stroke-width="1.4"/>
<text x="380" y="131" font-size="10.5" text-anchor="middle" fill="#1f2328">known, target 0</text>
<text x="380" y="144" font-size="10" text-anchor="middle" fill="#7d858f">byte 25 or less</text>
<line x1="80" y1="150" x2="80" y2="180" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="184" width="200" height="34" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="120" y="199" font-size="10.5" text-anchor="middle" fill="#1f2328">water and NIR (800-900 nm)</text>
<text x="120" y="212" font-size="10.5" text-anchor="middle" fill="#1f2328">mean &gt; 0.15 ?</text>
<line x1="60" y1="218" x2="60" y2="250" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="180" y1="218" x2="180" y2="250" stroke="#4b535d" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="54" y="238" font-size="10" text-anchor="end" fill="#4b535d">no</text>
<text x="186" y="238" font-size="10" fill="#4b535d">yes</text>
<rect x="10" y="254" width="110" height="34" rx="4" fill="#ffffff" stroke="#4b535d" stroke-width="1.4"/>
<text x="65" y="275" font-size="10.5" text-anchor="middle" fill="#1f2328">known, target 1</text>
<rect x="130" y="254" width="130" height="34" rx="4" fill="#ffffff" stroke="#b45f06" stroke-width="1.8"/>
<text x="195" y="269" font-size="10.5" text-anchor="middle" fill="#b45f06" font-weight="700">known NOT-water</text>
<text x="195" y="282" font-size="10" text-anchor="middle" fill="#7d858f">target 0 (the guard)</text>
<text x="270" y="200" font-size="10" fill="#4b535d">cloud: no guard - the bright-and-flat</text>
<text x="270" y="214" font-size="10" fill="#4b535d">test rejected 69% of real clouds</text>
<text x="18" y="318" font-size="10" fill="#4b535d">thin cloud, shadow, snow: always unknown here</text>
<text x="18" y="334" font-size="10" fill="#4b535d">(EnMAP's labels teach them); so is any pixel</text>
<text x="18" y="350" font-size="10" fill="#4b535d">with under 90% of its bands finite</text>
<!-- divider -->
<line x1="470" y1="40" x2="470" y2="340" stroke="#e3e6ea" stroke-width="1.2"/>
<!-- panel b -->
<text x="490" y="24" font-size="12.5" fill="#1f2328" font-weight="700">(b) real PRISMA bench, pAUC to 1% false alarms</text>
<line x1="530" y1="280" x2="880" y2="280" stroke="#4b535d" stroke-width="1.2"/>
<line x1="530" y1="280" x2="530" y2="80" stroke="#4b535d" stroke-width="1.2"/>
<line x1="530" y1="222.9" x2="880" y2="222.9" stroke="#e3e6ea" stroke-width="1"/>
<line x1="530" y1="165.7" x2="880" y2="165.7" stroke="#e3e6ea" stroke-width="1"/>
<line x1="530" y1="108.6" x2="880" y2="108.6" stroke="#e3e6ea" stroke-width="1"/>
<text x="524" y="284" font-size="10" text-anchor="end" fill="#7d858f">0.140</text>
<text x="524" y="226.9" font-size="10" text-anchor="end" fill="#7d858f">0.150</text>
<text x="524" y="169.7" font-size="10" text-anchor="end" fill="#7d858f">0.160</text>
<text x="524" y="112.6" font-size="10" text-anchor="end" fill="#7d858f">0.170</text>
<text x="536" y="76" font-size="10" fill="#7d858f">axis starts at 0.140, not 0</text>
<rect x="545" y="171.4" width="70" height="108.6" fill="#5f6770"/>
<text x="580" y="165" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700">0.159</text>
<rect x="630" y="154.3" width="70" height="17.1" fill="#0f766e"/>
<text x="665" y="148" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700">+0.003</text>
<rect x="715" y="108.6" width="70" height="45.7" fill="#b45f06"/>
<text x="750" y="102" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700">+0.008</text>
<rect x="800" y="108.6" width="70" height="171.4" fill="#ffffff" stroke="#b45f06" stroke-width="2.2"/>
<text x="835" y="102" font-size="10.5" text-anchor="middle" fill="#1f2328" font-weight="700">0.170</text>
<line x1="615" y1="171.4" x2="630" y2="171.4" stroke="#4b535d" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="700" y1="154.3" x2="715" y2="154.3" stroke="#4b535d" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="785" y1="108.6" x2="800" y2="108.6" stroke="#4b535d" stroke-width="1" stroke-dasharray="3 2"/>
<text x="580" y="298" font-size="10.5" text-anchor="middle" fill="#1f2328">shipped</text>
<text x="580" y="311" font-size="10.5" text-anchor="middle" fill="#1f2328">v0.2.0</text>
<text x="665" y="298" font-size="10.5" text-anchor="middle" fill="#1f2328">FT04</text>
<text x="665" y="311" font-size="10.5" text-anchor="middle" fill="#1f2328">model</text>
<text x="750" y="298" font-size="10.5" text-anchor="middle" fill="#1f2328">cloud</text>
<text x="750" y="311" font-size="10.5" text-anchor="middle" fill="#1f2328">exclusion</text>
<text x="835" y="298" font-size="10.5" text-anchor="middle" fill="#1f2328">release</text>
<text x="835" y="311" font-size="10.5" text-anchor="middle" fill="#1f2328">candidate</text>
<text x="490" y="336" font-size="10" fill="#4b535d">exclusion is 0.008 of the 0.011 gain (73%);</text>
<text x="490" y="351" font-size="10" fill="#4b535d">v0.2.0 + cloud exclusion was not run on this bench</text>
</svg>
