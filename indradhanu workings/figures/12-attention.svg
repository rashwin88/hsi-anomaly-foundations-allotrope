<text x="30" y="272" font-size="11" text-anchor="start" fill="#4b535d">Each output is a blend of all values, weighted by how well its query matches each key.</text>
<text x="30" y="290" font-size="11" text-anchor="start" fill="#4b535d">The score matrix is N x N: at stage 1, N = 1,024 tokens gives 1,048,576 scores per head - the cost part 13 removes.</text>
