<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One FT05 training step: loader workers on the CPU implant half the tiles and keep the clean copy; the model on the GPU reads the implanted tile and is graded against the clean tile, with weight 5 near implants">
<title>One FT05 training step: loader workers on the CPU implant half the tiles and keep the clean copy; the model on the GPU reads the implanted tile and is graded against the clean tile, with weight 5 near implants</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b535d"/></marker></defs>
<rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
<text x="18" y="24" font-size="12.5" fill="#1f2328" font-weight="700">FT05: implanted input, clean target</text>
<rect x="18" y="44" width="380" height="290" rx="8" fill="#f6f7f9" stroke="#7d858f" stroke-dasharray="5 4"/>
<text x="30" y="64" font-size="11.5" fill="#1f2328" font-weight="700">CPU - loader workers (prepare_sample)</text>
<text x="30" y="80" font-size="10.5" fill="#7d858f">sets the pace: about 2 h 40 min an epoch</text>
<rect x="40" y="96" width="150" height="50" rx="6" fill="#0f766e" fill-opacity="0.15" stroke="#0f766e"/>
<text x="115" y="116" font-size="11" text-anchor="middle" fill="#1f2328">training tile</text>
<text x="115" y="132" font-size="10" text-anchor="middle" fill="#4b535d">(B, 128, 128)</text>
<rect x="225" y="96" width="155" height="50" rx="6" fill="#b45f06" fill-opacity="0.15" stroke="#b45f06"/>
<text x="302" y="114" font-size="11" text-anchor="middle" fill="#1f2328">implant_tile</text>
<text x="302" y="130" font-size="10" text-anchor="middle" fill="#4b535d">half the tiles, 1-4 objects</text>
<line x1="190" y1="121" x2="222" y2="121" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="225" y="186" width="155" height="44" rx="6" fill="#b45f06" fill-opacity="0.15" stroke="#b45f06"/>
<text x="302" y="206" font-size="11" text-anchor="middle" fill="#1f2328">implanted input</text>
<text x="302" y="221" font-size="10" text-anchor="middle" fill="#4b535d">pixels</text>
<line x1="302" y1="146" x2="302" y2="183" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="186" width="150" height="44" rx="6" fill="#0f766e" fill-opacity="0.15" stroke="#0f766e"/>
<text x="115" y="206" font-size="11" text-anchor="middle" fill="#1f2328">clean target</text>
<text x="115" y="221" font-size="10" text-anchor="middle" fill="#4b535d">clean.npy</text>
<line x1="115" y1="146" x2="115" y2="183" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="225" y="262" width="155" height="44" rx="6" fill="#ffffff" stroke="#7d858f"/>
<text x="302" y="282" font-size="11" text-anchor="middle" fill="#1f2328">near mask</text>
<text x="302" y="297" font-size="10" text-anchor="middle" fill="#4b535d">implant.npy: within 3 px</text>
<line x1="302" y1="230" x2="302" y2="259" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="470" y="44" width="412" height="290" rx="8" fill="#eef0fb" stroke="#3f4aa8" stroke-dasharray="5 4"/>
<text x="482" y="64" font-size="11.5" fill="#1f2328" font-weight="700">GPU - the model (_mixed_loss)</text>
<text x="482" y="80" font-size="10.5" fill="#7d858f">busy 0-7% of the time: waiting for the loader</text>
<rect x="520" y="180" width="140" height="56" rx="6" fill="#3f4aa8" fill-opacity="0.15" stroke="#3f4aa8"/>
<text x="590" y="203" font-size="11" text-anchor="middle" fill="#1f2328">Indradhanu</text>
<text x="590" y="219" font-size="10" text-anchor="middle" fill="#4b535d">tokens hidden (0.65)</text>
<line x1="380" y1="208" x2="517" y2="208" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="710" y="180" width="150" height="56" rx="6" fill="#b45f06" fill-opacity="0.15" stroke="#b45f06"/>
<text x="785" y="200" font-size="11" text-anchor="middle" fill="#1f2328">L1 + 0.5 SAM</text>
<text x="785" y="215" font-size="10" text-anchor="middle" fill="#4b535d">x_hat vs CLEAN tile</text>
<text x="785" y="229" font-size="10" text-anchor="middle" fill="#4b535d">hidden pixels only</text>
<line x1="660" y1="208" x2="707" y2="208" stroke="#4b535d" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M115,230 L115,320 L785,320 L785,239" fill="none" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="560" y="314" font-size="10.5" text-anchor="middle" fill="#0f766e">the target is the tile before implanting</text>
<path d="M380,284 L740,284 L740,239" fill="none" stroke="#7d858f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="560" y="278" font-size="10.5" text-anchor="middle" fill="#4b535d">weight 5 near implants, 1 elsewhere</text>
<text x="676" y="120" font-size="10.5" text-anchor="middle" fill="#4b535d">graded on the background under the object,</text>
<text x="676" y="136" font-size="10.5" text-anchor="middle" fill="#4b535d">so the residual at an anomaly grows</text>
</svg>
