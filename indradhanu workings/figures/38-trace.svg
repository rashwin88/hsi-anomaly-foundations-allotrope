<text x="853" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">loss on</text>
<text x="853" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">valid bands</text>
<line x1="791" y1="96" x2="802" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<path d="M12,132 q0,5 5,5 L170,137 q5,0 5,5 q0,-5 5,-5 L333,137 q5,0 5,-5" fill="none" stroke="#8a3b86" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="175" y="156" font-size="10.5" text-anchor="middle" fill="#8a3b86">per pixel: nothing moves between pixels</text>
<path d="M351,132 q0,5 5,5 L509,137 q5,0 5,5 q0,-5 5,-5 L672,137 q5,0 5,-5" fill="none" stroke="#3a4aa8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="514" y="156" font-size="10.5" text-anchor="middle" fill="#3a4aa8">unchanged spatial model (parts 11-21)</text>
<text x="12" y="34" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">Trap 1 - hide pixels, not bands: a hidden pixel's tokens are removed before any spatial attention,</text>
<text x="12" y="50" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="600">so its reconstruction can only come from its neighbours.</text>
<text x="12" y="200" font-size="10.5" text-anchor="start" fill="#4b535d">Trap 2 - normalise by a wavelength curve, never by per-scene min-max (it erases the absolute reflectance library matching needs).</text>
<text x="12" y="218" font-size="10.5" text-anchor="start" fill="#4b535d">Trap 3 - more sophisticated is not evidence: variants A, B, C are compared on reconstruction and on detection.</text>
</svg>
