<rect x="125" y="70" width="100" height="52" rx="6" fill="#e3f3f1" stroke="#0f766e" stroke-width="1.3"/>
<text x="175" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">normalise by</text>
<text x="175" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">wavelength</text>
<line x1="113" y1="96" x2="124" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="238" y="70" width="100" height="52" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="288" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">spectral</text>
<text x="288" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">compressor</text>
<line x1="226" y1="96" x2="237" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="351" y="70" width="100" height="52" rx="6" fill="#ffffff" stroke="#8f979f" stroke-width="1.3"/>
<text x="401" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">hide ~65%</text>
<text x="401" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">of tokens</text>
<line x1="339" y1="96" x2="350" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="464" y="70" width="100" height="52" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="514" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">SegFormer</text>
<text x="514" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">encoder</text>
<line x1="452" y1="96" x2="463" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="577" y="70" width="100" height="52" rx="6" fill="#e9ebf8" stroke="#3a4aa8" stroke-width="1.3"/>
<text x="627" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">SegFormer</text>
<text x="627" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">decoder</text>
<line x1="565" y1="96" x2="576" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
<rect x="690" y="70" width="100" height="52" rx="6" fill="#f5e9f4" stroke="#8a3b86" stroke-width="1.3"/>
<text x="740" y="92" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">spectral</text>
<text x="740" y="108" font-size="10.5" text-anchor="middle" fill="#4b535d">decoder</text>
<line x1="678" y1="96" x2="689" y2="96" stroke="#4b535d" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ah-ink2)"/>
